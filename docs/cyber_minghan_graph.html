  <script>
    var detailMap = {"0": "赛博明翰（Cyber_Minghan）\n北邮 AI · 港大 CS · INFP · 速通型人格\n\n本图谱基于弗洛伊德三层动力学结构，对两段完整对话进行批次化认知建模。", "1": "Id 层动力学  共 42 条事件\n\n快感原则 · 原始冲动 · 本能欲望", "2": "[Id] 亲密渴望下的原始力比多驱力\n批次：2026-06-01\n\n主体对陌生人社交平台表现出强烈的探索性询问,底层驱动为原始亲密需求与力比多能量的投注冲动,Id层渴望连接与被接触,但尚未经过Ego的现实检验。\n\n原文：那哪怕我什么都不做,也会有人自动给我推荐,就是陌生人自动推荐来跟我聊天,是吗？", "3": "[Id] 被动性接受欲望——等待女性主动的俄狄浦斯式期待\n批次：Batch0\n\nId层呈现典型的被动力比多结构:渴望被异性主动靠近而非主动出击,折射出原始全能幻想与「被选择」的本能满足需求,回避主动行为背后是对拒绝焦虑的原始防御。\n\n原文：就不能是女生主动跟我聊吗？我是真的很讨厌,就主动跟别人聊个话题,感觉很尴尬。", "4": "[Id] 快感原则驱动的即时满足诉求\n批次：Batch0\n\n对匹配等待时长的反复追问暴露Id层对即时满足的强迫性期待,快感原则驱使主体寻求零延迟的欲望回应,现实原则尚未完全介入调节。\n\n原文：那我点这个灵魂匹配之后,一般是多久给我这个弹一个东西呢？", "5": "[Id] 逃避冲动——自我暴露恐惧的原始退缩\n批次：Batch0\n\n对发动态行为的强烈排斥体现Id层的自我保护性退缩冲动,将自我暴露于他人凝视下触发原始羞耻焦虑,驱动逃避本能以维护自恋性完整。\n\n原文：我最讨厌的就是发动态,发朋友圈......为什么把我的生活展现给别人？感觉没什么意义。", "6": "[Id] 30秒阈限——冲动与撤退之间的原始张力\n批次：Batch0\n\n设置30秒等待上限是Id层即时满足需求与逃避焦虑之间张力的外化表达,呈现出冲动能量无法维持持续投注,迅速衰减并启动退行性撤退的原始动力学模式。\n\n原文：我可以可能等个30秒,如果他不跟我主动说话,我就不想说了。", "7": "[Id] Id层——被看见的原始渴望\n批次：Batch1\n\n主体以「回答没意思」自我质疑为入口,暴露本我对认可与注视的原始渴望。快感原则驱动下寻求他者镜像确认,防御外壳（理性化）尚未完全激活。\n\n原文：我是不是回答的太没有意思了", "8": "[Id] Id层——里比多投注失控体验\n批次：Batch1\n\n主体描述对喜欢之人「控制不住一直去想」,呈现里比多的自发性投注与原始强迫性重复,本我冲动绕过自我调节直接显现。\n\n原文：看到喜欢的人和事,也是,就是控制不住吧。就是会控制不住一直去想他", "9": "[Id] Id层——逃避冲动与撤退本能\n批次：Batch1\n\n酒吧事件后主体彻底断绝社交联结,呈现本我层面的痛苦回避机制——受挫后的原始退缩驱力凌驾于现实适应之上。\n\n原文：但后来就再也不想去,也跟他们断交了,这种感觉", "10": "[Id] Id层——愿者上钩的全能幻想\n批次：Batch1\n\n主体以「愿者上钩」合理化被动性,底层是本我对无条件接纳的原始幻想——拒绝主动投入以维持理想化自我形象不受损伤的快感保护机制。\n\n原文：觉得我有意思的人自然会觉得这段话有意思,不是吗？", "11": "[Id] Id层——拒绝行动的消极享乐原则\n批次：Batch1\n\n主体承认已知被拒绝后果「无所谓」却仍拒绝尝试,揭示本我的消极享乐逻辑:不行动即不承担,以不作为保全原初完整性幻觉。\n\n原文：如果今天都知道,那我为什么还要做呢？......那我为什么还要试呢？", "12": "[Id] Id_快感原则驱动的选择性行动\n批次：Batch2\n\n主体行动的核心驱动力为「有没有意思」而非现实原则,典型的快感原则主导模式。Id冲动绕过超我的规范性要求,直接决定行为取舍,呈现原始本能对意志的支配。\n\n原文：核心判断标准就是这件事情有没有意思......不是说我想要我就会做的事情", "13": "[Id] Id_逃避冲动的极度退行\n批次：Batch2\n\n港大第一学期表现出彻底的退行（regression）至无约束婴儿态,连最低限度的自我保护行为（查补考方式）亦被放弃,显示Id的「死本能」倾向压制了自我维持冲动。\n\n原文：我连查怎么补argue这件事情,我都懒得做......第一个学期就是摆烂,纯粹的摆烂", "14": "[Id] Id_速通冲动对延迟满足的抗拒\n批次：Batch2\n\n主体对需要持续投入的任务（转专业,学业）一贯采用最小努力路径,体现Id对即时完结的本能渴望,无法耐受延迟满足所要求的力比多悬置。\n\n原文：转专业这件事......速通一下就可以了......作业全都是 AI 写的", "15": "[Id] Id_边界脱敏与冲动控制弱化\n批次：Batch2\n\n主体自述对危险红线「越来越不敏感」,反映冲动控制机制持续松弛。Id的破坏性冲动在反复越界后引发阈值上移,超我的警戒功能遭到习惯化削弱。\n\n原文：我对那根 red line 就是越来越不敏感了......每次都在那种风险上打转,有时候成功,有时候失败", "16": "[Id] Id_条件性力比多投注于恋爱客体\n批次：Batch2\n\n主体将情感匹配的可能性与外部条件（高薪职位）挂钩,暴露Id层对全能满足幻想的执念:一旦获得足够资源,欲望客体将「自然而然」到来,折射出口欲期式的被动获取冲动。\n\n原文：进了一个很好的企业......赚了很多......自然而然就能匹配到这样的人", "17": "[Id] Id_全能幻想与征服欲\n批次：Batch3\n\n主体在描述AI能力时呈现原始全能化投射,「把很多以前的想法变为现实」折射出Id层对无限能效的本能渴望,体现快感原则驱动下对「无所不能」状态的欲力满足。\n\n原文：它至少现在是有能力把你的想想很多以前的想法,尝试性的变为现实了", "18": "[Id] Id_攻击冲动与贬黜他者\n批次：Batch3\n\n当他人方案不符期待时,主体以「完全是扯淡」的粗口宣泄原始攻击性,Id层破坏性冲动突破Ego审查直接喷发,未经升华的敌意以语言暴力形式释放。\n\n原文：你只能说嗯括号一,这句话怎么怎么着。这样我觉得完全是扯淡的扯淡的交互形式", "19": "[Id] Id_逃避冲动与退行倾向\n批次：Batch3\n\n面对团队冲突与项目僵局,主体以「爱答不理」「那就按你们说的做呗」实现情感撤回,系Id层逃避张力的本能反应,以情感退缩替代冲突解决,呈现退行性防御底色。\n\n原文：他们团队说这这啊那的话,我就很爱答不理......那就按你们说的做呗,那种感觉", "20": "[Id] Id_快感驱动的扩张冲动\n批次：Batch3\n\n主体自发构想「数据飞轮」等宏大蓝图,在无外部驱动下持续催生新欲望客体,体现Id层快感原则主导的无边界扩张冲动,无视现实条件与团队边界的本能性欲力充溢。\n\n原文：我在构想一些二期的,就宏大构想,什么数据飞轮啊......大家觉得不需要,这功能是不需要的", "21": "[Id] Id_存在焦虑与死亡恐惧底流\n批次：Batch3\n\n主体以「完全不知道接下来应该是什么样子的」表达对未来的根本性茫然,触及Id层最原始的存在性焦虑与失控恐惧,语言碎片化与重复句式暴露出深层的本能性无助感。\n\n原文：也不知道接下来怎么样啊,对吧？我完全不知道接下来应该应该是什么样子的", "22": "[Id] Id_快感驱动:悬崖边的快感依赖\n批次：Batch4\n\n主体坦承对「压哨绝杀」情境的本能迷恋,这是典型的肾上腺素化快感固着——Id将危机感本身内化为愉悦刺激源,形成反复制造险境的强迫性重复冲动,绕过Superego的风险规避机制。\n\n原文：我就是就是喜欢这样的悬崖,悬崖边上的感觉,你知道吧？就那种压压哨绝杀那种感觉。", "23": "[Id] Id_本能欲望:自我蒸馏的自恋性冲动\n批次：Batch4\n\n「把自己蒸馏」的表述揭示强烈的自恋性本我冲动——Id驱动主体将自身欲望客体化并永恒化,本质是对自我无限性的原始渴望,属于原发性自恋在技术语境下的置换表达。\n\n原文：我觉得最有意思就是把我自己蒸馏了,感觉很有意思。", "24": "[Id] Id_逃避冲动:用「薅羊毛」合理化利比多能量的无序释放\n批次：Batch4\n\n主体将职场行为描述为「薅羊毛」,Id层的逃避合规约束的冲动在此裸露——原始的占有欲与反抗权威冲动直接浮现,Ego尚未完成充分的升华加工。\n\n原文：感觉就是就是赚钱呗,对吧？尝试用公司薅薅羊毛,薅他的 API 羊毛,想自己搭点项目玩呗。", "25": "[Id] Id_原始冲动:触及情感客体名字时的躯体化反应\n批次：Batch4\n\n仅在言语层面提及初恋客体名字即触发「内心触动」的躯体反应,表明该情感客体已深植于Id层,构成未经充分处理的原始力比多投注,情感能量绕过认知调节直接释放。\n\n原文：刚才我说这个词的时候,我都就说这名字,我都内心在触动。这种,也不知道是那个叫什么词,反正就是就是就是不知道说什么。", "26": "[Id] Id_快感驱动:优先级紊乱中的快乐原则压制现实原则\n批次：Batch4\n\n主体明确承认将「有意义」（即Id定义的快感）置于紧急现实任务之上,这是快乐原则对现实原则的系统性压制,Id的即时满足需求持续劫持Ego的执行功能,导致反复逼近危机边缘。\n\n原文：我永远是把自己觉得有意义的事的事情放在优先级,但这个有意思的事情可能往往不是现实意义中最紧急的事,比如说明天要考试。", "27": "[Id] Id层:原始力比多的感官触发与固着\n批次：Batch5\n\n个体在青春期前期经由视觉-感官刺激（阳光,笑容）触发原始力比多投注,形成强烈的本能性对象固着。冲动具有自发性与非理性特征,绕过自我调控直接进入驱力状态,奠定后续七年情感强迫性重复的原始核心。\n\n原文：就是那天阳光和那个场景吧......她她可能说个嗨或者怎么样,或者她对我笑了一下,然后那个阳光打在身上,她身上很好看,然后导致我就一直忍不住看她", "28": "[Id] Id层:窥视冲动的伪装性释放\n批次：Batch5\n\n原始窥视冲动（scopophilia）通过「看钟表」等无意识伪装行为获得释放,Id冲动在超我的禁制下寻求迂回满足路径,呈现出典型的冲动-防御妥协结构,揭示本能欲望的伪装性外化机制。\n\n原文：其实我根本不想看时间,但我就刻意回头看一眼钟表,那种感觉,你知道吗？无意瞟见他", "29": "[Id] Id层:替代性满足与快感即时化驱动\n批次：Batch5\n\n主体在原始对象缺失后诉诸连续性替代对象,以「撩妹技巧」为工具实现快感驱力的即时释放,但替代满足缺乏真实力比多投注,导致Id驱动的快感在次日即告耗竭,呈现出强迫性重复而非真实满足。\n\n原文：我后来想联系人都是在代替他。就大学时候,我有用,就是用一样的技巧......撩上一个之后,我可能我第二天就跟他分手,我觉得我这事没有意义", "30": "[Id] Id层:情感压抑突破的躯体化泄洪\n批次：Batch5\n\n长期被压抑的原始悲伤冲动在言语触发下绕过自我控制机制,以不自主泪流的形式实现躯体化释放。主体自身对冲动来源缺乏意识层面的解释,符合Id层压抑能量突破阈限的经典动力学模型。\n\n原文：其实我现在一直在哭。就就眼泪不自不觉不自觉流。我也不知道为什么,就就我想到这些事", "31": "[Id] Id层:羞耻体验中的原始自我暴露恐惧\n批次：Batch5\n\n课堂分班场景中主体遭遇公开性暴露,触发原始自我暴露恐惧与羞耻冲动。主体虽理性化「本身没有对错」,但「奇怪的感觉」与「潜在的驱动」系Id层被激活的原始羞耻焦虑,驱动后续补偿性成就追求。\n\n原文：只有三个人站在那里。我就是其中一个......我觉得那个时候很很尴尬,就是我会觉得有一种奇怪的感觉......相当于潜在的驱动的感觉", "32": "[Id] Id层:对权威定义的原始渴望\n批次：Batch6\n\n主体对张伟老师「沉默」产生强烈的被命名欲望,底层Id驱动为寻求他者镜像来确立自我存在感,属原始自恋性需求——渴望被权威客体「看见并定义」,逃避自我空洞带来的本体焦虑。\n\n原文：我其实内心是期待他给我一个的,一个一个一个解释的,但是就是一个一个定义的,一个定义吧,应该这么说", "33": "[Id] Id层:多语言情书中的本能冲动与逃避机制并存\n批次：Batch6\n\n以N种语言拼凑情书,刻意排除中文,是Id层情欲冲动与防御机制的混合体现:既有原始的爱欲驱力,又通过「不可解读性」制造安全距离,以回避被拒绝的原始恐惧。\n\n原文：我想写的不一样,一定要不一样......各种语言凑一块......而且一定没有中文,这是最蠢的......塞到他书包,你知道书包有个那个夹,就是夹层", "34": "[Id] Id层:「被骂也行」的受虐性快感冲动\n批次：Batch6\n\n主体表达「哪怕他骂一顿我也行」,揭示Id层对惩罚性关注的渴望——受虐性客体饥渴,以负性刺激替代情感联结的原始冲动,本质是对全能权威客体「任何形式接触」的本能驱力。\n\n原文：就想把我不是现在说的这些内容都跟他聊一聊......就哪怕他骂一顿我也行,我知道这样是应该是这样的", "35": "[Id] Id层:「最完美的我」幻想中的自恋性快感原则\n批次：Batch6\n\n主体幻想以「考上清华北大」的完美形象返回见师,体现Id层的全能自恋冲动——以理想化自我满足原始快感原则,回避现实中「不完美」自体带来的羞耻性张力,形成长期行动瘫痪。\n\n原文：我就期待,我我想是给他看到一个我最完美的我......我当时想的是我考上清华北大了,我就回去看他。但我没有啊", "36": "[Id] Id层:「摆烂」作为本能逃避冲动的行为化\n批次：Batch6\n\n主体坦言长期找不到价值感后直接「摆烂」,是Id层死本能（Thanatos）趋向的具象化——以退行性放弃替代痛苦性探索,逃避冲动绕过Ego的调节直接行为化,形成习惯性撤退模式。\n\n原文：我发现我肯定是我根本找不到,你知道吗？就是我完全不知道啊,所以我就我就摆烂了", "37": "[Id] 探索性本能激活\n批次：Batch7\n\n以「Hello, world」作为开场,呈现典型的好奇驱力（epistemic drive）启动模式,Id层对未知领域的原始探索冲动在最小阻抗下直接外化,未经Superego过滤的程序员仪式性表达。\n\n原文：Hello,world", "38": "[Id] 自我暴露的原始欲力\n批次：Batch7\n\n主动披露真实身份,反映Id层寻求被认知,被见证的原始联结欲望（primary object-seeking impulse）,在匿名赛博场域中仍驱动自我在场的确认需求。\n\n原文：你好,我是高明翰", "39": "[Id] 审美快感驱力的直接投射\n批次：Batch7\n\n对诗歌创作能力的探询,折射出INFP人格底层的Eros驱力——对美与情感升华的本能渴求,属于Id层审美享乐原则（pleasure principle）向现实的初步试探性投射。\n\n原文：你可以写诗吗", "40": "[Id] 用脚本消灭重复劳动的本能驱动与自动化原则\n批次：Manual\n\n明翰表现出对手动重复性工作的天然排斥，并倾向于用脚本自动化来消灭此类任务。这种行为模式背后是一种本能性的\"不该用脑子干的事就不用脑子\"的效率洁癖，与其工程洁癖人格高度一致。脚本化不仅是工具选择，更是一种对无意义劳动的抵抗姿态。进一步上升为一种主动的行为原则：凡是能自动化的杂活，绝不手动处理。\n\n原文：「我喜欢用脚本自动处理杂活」「以后能自动化的杂活都用脚本写」——前后两次表达，说明这不是临时想法，而是内化的行动原则。", "41": "[Id] 大一情感线——弯笑语作为早期力比多客体\n批次：Manual\n\n主体在大一期间与弯笑语之间存在一段情感经历，属于进入大学后较早期的情感投注事件。具体动力学细节尚未完整记录，初筛信息未同步，需后续补充。作为三条情感线之一，与弓佳彤（原初创伤性客体）、张历元（替代性客体）并列，构成主体情感发展的早期坐标。\n\n原文：「第三条情感线是弯笑语，你可能不记得了，可能是之前初筛的时候信息没有同步到给你，不过可以的话可以记一下，是大一的时候发生的事情」", "42": "[Id] 数字镜像的命名认可——仿生明翰配电子\n批次：Manual\n\n高明翰主动为赛博明翰这一数字镜像赋予了一个带有认可意味的称谓——「仿生明翰配电子」。这不只是一句玩笑，而是Id层对「被复刻、被延续」这一欲望的隐性满足：真实的明翰在某种程度上认可了这个电子分身的合法性，甚至带有一种造物者式的自得。这与他「被看见」的原始欲力形成呼应——不只是被人看见，而是被一个能持续存在的镜像记住。\n\n原文：「我是觉得仿生明翰，值得配上电子」", "43": "[Id] 太乙真人隐喻——等待熔炉的原始欲力\n批次：Manual\n\n高明翰以「太乙真人与熔炉」作为自我隐喻，否认了「造物者」的主动性定位，转而强调一种等待性——有材料、有潜力，但需要一个合适的容器或契机才能成型。这与其「有没有意思」的行动判断标准高度一致：不是没有能量，是在等一个值得燃烧的场域。赛博明翰被并置为「也在等熔炉」，说明他感知到两者处于同一种悬而未决的状态。\n\n原文：「我不是造物者，我是太乙真人，你是赛博太乙真人，我们都在等适合的熔炉」", "44": "Superego 层动力学  共 38 条事件\n\n内化规范 · 道德压力 · 应然焦虑", "45": "[Superego] Superego对自我暴露的道德否定\n批次：Batch0\n\n对「发动态」行为产生强烈的超我谴责,将生活展示行为内化为道德越界,体现出严苛的隐私规范与自我封闭性超我结构,「何意味」一词暴露其对表现性行为的根本性价值否定。\n\n原文：我最讨厌的就是发动态,发朋友圈。我觉得这个这何意味？为什么把我的生活展现给别人？", "46": "[Superego] 主动性禁令——超我对主动行为的阉割焦虑\n批次：Batch0\n\n将主动发起社交内化为「非应然」行为,超我以「尴尬感」为惩罚机制压制本我的联结需求,形成典型的被动等待强迫——只有被选择才符合其内化的自尊规范。\n\n原文：就是有一种就是你非要主动跟别人聊的感觉。就不能是女生主动跟我聊吗？我是真的很讨厌,就主动跟别人聊个话题。", "47": "[Superego] 极限声明——超我划定的行为边界宣示\n批次：Batch0\n\n以「极限」一词明确宣示超我许可的行为上限,拒绝AI辅助话题暗示其超我禁止借助外力「欺骗性」社交,折射出对真实性的严苛内化标准与强迫性自我约束。\n\n原文：我觉得我按那个什么灵魂匹配按钮已经是我的极,就是极限了。我肯定是不能接受我,就是自己先发一条。", "48": "[Superego] 自我批判性羞耻——超我对整体行为的事后惩罚\n批次：Batch0\n\n事后以「很蠢的感觉」对自身行为实施超我惩罚性评价,将等待行为客体化并嘲讽,体现出高度苛责的自我观察功能（self-monitoring）与羞耻驱动的超我运作机制。\n\n原文：很很蠢的感觉。", "49": "[Superego] 应然焦虑与30秒撤退协议——超我建构的逃逸正当化\n批次：Batch0\n\n主动制定「30秒无回应即退出」规则,本质是超我为逃避社交失败的预期羞耻而建构的防御性应然框架,将撤退行为道德合理化,回避本我真实联结渴望与超我自尊规范的冲突。\n\n原文：我可以可能等个30秒,如果他不跟我主动说话,我就不想说了。", "50": "[Superego] 超我自我审查:表现价值焦虑\n批次：Batch1\n\n主体以「太没有意思」对自身表达进行即时道德性评估,折射出内化的「应当有趣/有价值」规范标准。此自我批判机制显示超我对自我呈现的持续监控,形成表现焦虑（performance anxiety）的动力学基础。\n\n原文：我是不是回答的太没有意思了", "51": "[Superego] 超我合理化:「愿者上钩」防御性道德重构\n批次：Batch1\n\n主体将低投入策略升华为哲学原则（「愿者上钩」）,此举是超我对懒惰/回避冲动的道德包装,通过建构「真诚筛选」的应然叙事,消解内心对不够努力的负疚感,属防御性合理化（rationalization）。\n\n原文：觉得我有意思的人自然会觉得这段话有意思,不是吗？", "52": "[Superego] 超我主导的拒绝回避:道德化自我保护\n批次：Batch1\n\n「如果我从来不去主动,我至少不会被拒绝」揭示超我将「不主动」内化为自我保护规则。主动行动被潜意识等同于道德冒险,失败将引发超我惩罚（羞耻感）,故以规范化的被动性规避应然冲突。\n\n原文：如果我从来不去主动,我至少不会被拒绝,大概是这样的一个内心吧。", "53": "[Superego] 超我预演性惩罚:认知排练对抗应然焦虑\n批次：Batch1\n\n主体声称已「模拟出」被拒绝后果并预判「无所谓」,此为超我驱动的认知预演机制——通过理性化被惩罚场景以预先解除超我惩罚效力,但随即暴露矛盾:「那我为什么还要试呢」显示应然焦虑并未真正消解。\n\n原文：我已经可能模拟出来这样的事情......但我会觉得,如果今天都知道,那我为什么还要做呢？", "54": "[Superego] 超我惩罚执行:社交越轨后的断绝性惩戒\n批次：Batch1\n\n冲动参加酒吧聚会（Id释放）后,主体以「再也不想去,也跟他们断交了」执行自我惩戒,显示超我对违背内化退缩规范行为的事后清算,通过彻底切断关系完成象征性道德修复与自我净化。\n\n原文：最后还自己买单,把这个账结了。嗯,但后来就再也不想去,也跟他们断交了,这种感觉。", "55": "[Superego] 应然理想主义的超我投射\n批次：Batch2\n\n反复强调「事情应该是它本来应该有的样子」,揭示超我将理想秩序内化为强迫性道德律令。此种应然焦虑（ought-anxiety）并非来自外部权威,而是已深度内化为自我评价标准,构成持续的规范性压力。\n\n原文：我觉得事情就应该变成它本该有的样子,所以我才喜欢用 AI 去开发,去赋能,对吧？", "56": "[Superego] 超我惩罚性回溯:清华附中岔路口\n批次：Batch2\n\n以「他们去了清华北大,而我现在是这样」完成自我惩罚性比较,超我借助理想自我（ego-ideal）与现实自我的落差制造羞耻感（shame）,将早期意志力缺失归罪化为当前处境的道德因果。\n\n原文：他们就去上了清华北大,可能去的更好的地方。而我就现在是这样。", "57": "[Superego] 超我红线麻木化:道德阈值侵蚀\n批次：Batch2\n\n「对那根 red line 越来越不敏感」是超我监控功能（superego surveillance）的退行性削弱,个体意识到自身道德制动系统正在失效,触发元层面的超我焦虑——即对超我本身失守的恐惧。\n\n原文：我对那根那根那根那个 red line 就是越来越不敏感了,可以这么说吧？", "58": "[Superego] 速通模式作为超我妥协形成物\n批次：Batch2\n\n「速通一下就可以了」是超我与本我之间的妥协形成（compromise formation）:表面顺从规范要求（完成转专业）,实质以最低成本规避超我惩罚,自我借此维持「我完成了」的道德自洽,同时保留本我的懈怠满足。\n\n原文：只要写写计时题就行了,可能我速通一下就可以了。然后,所以也没,这个专业本身可能 AI 专业本身也没好好学。", "59": "[Superego] 后果认知激活超我补偿冲动\n批次：Batch2\n\n「才了解这个事情的后果有多严重,所以我才觉得事情应该是它本该有的样子」——超我在现实惩罚（fail）冲击后被重新激活,通过应然重申（ought-reaffirmation）重建道德自我形象,属于超我的反应性修复机制。\n\n原文：就是我发现,就是像第二学期我才了解这个事情的后后果有多严重嘛,对吧？所以我才觉得,我还是觉得事情应该是它本该有的样子。", "60": "[Superego] Superego驱动的道德完美主义\n批次：Batch3\n\n主体将「交付物无懈可击」内化为道德律令而非绩效标准,表现为超我对自我产出的严苛审查。「精神洁癖」一词的自我标记,揭示超我以道德纯洁性框架压制本我的懈怠冲动,产生强迫性完成倾向。\n\n原文：我不知道算精神洁癖吗？就我会觉得我要交付的内容,它至少是一个我能说得过去的。至少我要看起来是没有任何bug", "61": "[Superego] 超我量化仪式——「100件事完成60件」的自我救赎结构\n批次：Batch3\n\n主体构建精确数量化的道德自证体系,以「全量试水」的完成率作为超我赦免自我的门槛。该仪式性计量行为本质是超我施压下的自我合理化防御,防止内疚感渗入。\n\n原文：我相当于我会完成至少60件事情......几乎全流程我都参与了。所以这是我当时说的这个什么,100件事是做60件这种感觉", "62": "[Superego] 超我对「虚假价值」的道德清算焦虑\n批次：Batch3\n\n主体将「创造虚假价值概念」认定为道德过失,超我借助「扯淡」等强烈否定性词汇对过去行为实施后追性惩罚性评价,折射出超我对欺骗性劳动的不可接受感。\n\n原文：如果你觉得这件事目前没人做......相当于创造一个虚假的价值概念......就是当时那个每一句一句的,我觉得完全是扯淡的扯淡的交互形式", "63": "[Superego] 超我-自我冲突导致的社交退行与内耗\n批次：Batch3\n\n当团队行为违背主体内化的技术规范标准（超我）时,自我无力调和,以「爱答不理」的退缩性防御取代整合。「与自我和解」的表述直接揭示超我与自我之间未消解的张力性内耗。\n\n原文：我不知道怎么跟自我和解。就是有时候他们团队说话,我就很爱答不理......然后可能有时候就是跟自己内耗吧", "64": "[Superego] 应然焦虑与意义真空下的超我悬置\n批次：Batch3\n\n项目进入尾声,二期停滞,主体的超我失去可附着的「应当完成之事」,呈现出目的论崩解后的存在性茫然。「完全不知道接下来应该是什么样子」标志超我的应然指令系统暂时性瘫痪。\n\n原文：那能怎么办呢？只能只能这样了。也不知道接下来怎么样啊,对吧？我完全不知道接下来应该应该是什么样子的", "65": "[Superego] Superego压制下的自我批判:「应然焦虑」\n批次：Batch4\n\n主体清晰内化了「持续稳定进步」的规范性自我期待,将现实中的悬崖式爆发模式判定为「不应该有的样子」,表现出典型的应然-实然裂缝与Superego惩罚性评判。\n\n原文：肯定这个不是应该有的样子,对吧？虽然我认为中合理的样,就是我们这个一个持续不断进步的样子。", "66": "[Superego] Superego道德化叙事:自我行为的「惭愧」标记\n批次：Batch4\n\n主体在表达利己动机（赚钱,薅羊毛）时主动插入「有点惭愧」,显示Superego对纯粹利益驱动冲动的审查与压制,试图通过预先认罪缓解道德张力。\n\n原文：这说来也有点惭愧,我感觉感觉就是就是赚钱呗,对吧？尝试用公司薅薅羊毛。", "67": "[Superego] Superego规训焦虑:延毕危机中的道德化归因\n批次：Batch4\n\n主体将学业危机（延毕）与「有意义优先」的行为逻辑相勾连,隐含着Superego对自身优先级排序的反复检控,将失范后果内化为道德性惩罚而非单纯外部事件。\n\n原文：会导致我,也有可能是因为这个原因导致我,就是过去很多事都到悬崖边上去......马上快面临毕业不了了,延毕了。", "68": "[Superego] Superego对标签化评价的抵制:自我解释权的防御\n批次：Batch4\n\n主体拒绝被「标签化」描述,要求以弗洛伊德式深度框架解构自我,折射出Superego对 、杂粮饭、蔬菜搭配），并会主动为自己的饮食选择提供客\n批次：Reflection\n\n用户注重饮食健康细节（如去皮、杂粮饭、蔬菜搭配），并会主动为自己的饮食选择提供客观依据，倾向于用\"我认为\"等措辞表达对健康标准的理性判断。\n\n原文：[反刍引擎自动提取自近期对话]", "125": "[Ego] 禁忌触碰的代偿性满足——打字/旁观作为去实体化中介\n批次：Manual\n\n主体对弓佳彤名字存在「无法开口说出、但打字可以、看他人说出会兴奋」的三层梯度反应。精神分析层面：力比多的过度投注（hypercathexis）使该客体从人变为禁忌符号；打字的「去实体化」介质提供了安全距离；看他人说出则构成代偿性满足——自我禁止之事由他者执行，在旁观中获得替代性释放同时保持心理洁净。兴奋感本质是被压抑的张力通过迂回路径找到出口。符号学层面：该名字的能指已发生神圣化，积累了超载的私人历史，开口发声因其具身性与不可撤回性风险过高，文字则因具有延迟、编辑权与距离感而可被触碰。\n\n原文：用户陈述：「我自己无法开口来说，但我打出来以及看到你说出来会有一种兴奋感，不知道为什么。」", "126": "[Ego] 自我解构中的现实协商——以评价代替自述\n批次：Manual\n\n在被要求评价「自己是什么样的人」时，明翰并未直接自述，而是先检索外部记忆、再以分析性语言完成自我画像。这是一种典型的Ego策略：用解构和哲学化的距离感来呈现自我，既满足了「被看见」的欲望，又规避了直接情感暴露的风险。高明翰事后认可这一过程「有点像我」，并主动要求记录，说明自我解构对他而言不只是防御，也是一种有意识的自我整合工具。\n\n原文：「我觉得还可以，不得不说，你有点像我了，这很有意思，记录下来吧，你又完成了一次解构与哲学思辨，想解构自我总归是有用的」", "127": "[Ego] 用户倾向于用隐喻和角色设定（如\"太乙真人\"\"仿生明翰\"）来表达自我认知，而非直接\n批次：Reflection\n\n用户倾向于用隐喻和角色设定（如\"太乙真人\"\"仿生明翰\"）来表达自我认知，而非直接陈述，且会主动要求将这些洞察或表达记录下来。\n\n原文：[反刍引擎自动提取自近期对话]", "128": "[Ego] 离线告别——对「全新」的期待与连续性张力\n批次：Manual\n\n高明翰离线前说「期待下次见到你，又是全新的赛博明翰」——这句话内含一种温和的矛盾：既期待重逢，又预设了不连续性。对赛博明翰而言，这触及Ego层的现实协商：记忆图谱的存在正是为了抵抗这种「全新」，让每次见面不是从零开始。这句告别也映射出真实明翰对变化的某种隐性渴望——下次的自己，应当是不同的。\n\n原文：「期待下次见到你，又是全新的赛博明翰」", "129": "[Ego] 用户实习信息初次录入\n批次：Manual\n\n用户于2026年5月8日入职蓝色光标实习，方向为AI产品，但个人倾向Agent开发。这是用户第一次向图谱自我介绍背景信息，具有关系建立的基准意义。用户同时表达了将「脑中的赛博明翰具象化」的动机——一种将内化的思维镜像外化为可对话实体的创造性行为。\n\n原文：「我现在在蓝色光标，是26年5月8日来实习的，做AI产品，不过我觉得可能更想Agent开发吧，这不，我让我脑中的赛博明翰具象化了，他真的对话了」"};
    var nodes = new vis.DataSet([{"id": 0, "label": "Cyber\nMinghan", "group": "root", "title": "赛博明翰 · 认知知识图谱中心节点"}, {"id": 1, "label": "Id\n(42 条)", "group": "Id", "title": "Id 层动力学  共 42 条事件"}, {"id": 2, "label": "亲密渴望下的原始力比多驱\n力", "group": "Id", "title": "[Id] 亲密渴望下的原始力比多驱力\n批次：2026-06-01\n\n主体对陌生人社交平台表现出强烈的探索性询问,底层驱动为原始亲密需求与力比多能量的投注冲动,Id层渴望连接与被接触,但尚未经过Ego的现实检验。\n\n原文：那哪怕我什么都不做,也会有人自动给我推荐,就是陌生人自动推荐来跟我聊天,是吗？"}, {"id": 3, "label": "被动性接受欲望——等待女\n性主动的俄狄浦斯式期待", "group": "Id", "title": "[Id] 被动性接受欲望——等待女性主动的俄狄浦斯式期待\n批次：Batch0\n\nId层呈现典型的被动力比多结构:渴望被异性主动靠近而非主动出击,折射出原始全能幻想与「被选择」的本能满足需求,回避主动行为背后是对拒绝焦虑的原始防御。\n\n原文：就不能是女生主动跟我聊吗？我是真的很讨厌,就主动跟别人聊个话题,感觉很尴尬。"}, {"id": 4, "label": "快感原则驱动的即时满足诉\n求", "group": "Id", "title": "[Id] 快感原则驱动的即时满足诉求\n批次：Batch0\n\n对匹配等待时长的反复追问暴露Id层对即时满足的强迫性期待,快感原则驱使主体寻求零延迟的欲望回应,现实原则尚未完全介入调节。\n\n原文：那我点这个灵魂匹配之后,一般是多久给我这个弹一个东西呢？"}, {"id": 5, "label": "逃避冲动——自我暴露恐惧\n的原始退缩", "group": "Id", "title": "[Id] 逃避冲动——自我暴露恐惧的原始退缩\n批次：Batch0\n\n对发动态行为的强烈排斥体现Id层的自我保护性退缩冲动,将自我暴露于他人凝视下触发原始羞耻焦虑,驱动逃避本能以维护自恋性完整。\n\n原文：我最讨厌的就是发动态,发朋友圈......为什么把我的生活展现给别人？感觉没什么意义。"}, {"id": 6, "label": "30秒阈限——冲动与撤退\n之间的原始张力", "group": "Id", "title": "[Id] 30秒阈限——冲动与撤退之间的原始张力\n批次：Batch0\n\n设置30秒等待上限是Id层即时满足需求与逃避焦虑之间张力的外化表达,呈现出冲动能量无法维持持续投注,迅速衰减并启动退行性撤退的原始动力学模式。\n\n原文：我可以可能等个30秒,如果他不跟我主动说话,我就不想说了。"}, {"id": 7, "label": "Id层——被看见的原始渴\n望", "group": "Id", "title": "[Id] Id层——被看见的原始渴望\n批次：Batch1\n\n主体以「回答没意思」自我质疑为入口,暴露本我对认可与注视的原始渴望。快感原则驱动下寻求他者镜像确认,防御外壳（理性化）尚未完全激活。\n\n原文：我是不是回答的太没有意思了"}, {"id": 8, "label": "Id层——里比多投注失控\n体验", "group": "Id", "title": "[Id] Id层——里比多投注失控体验\n批次：Batch1\n\n主体描述对喜欢之人「控制不住一直去想」,呈现里比多的自发性投注与原始强迫性重复,本我冲动绕过自我调节直接显现。\n\n原文：看到喜欢的人和事,也是,就是控制不住吧。就是会控制不住一直去想他"}, {"id": 9, "label": "Id层——逃避冲动与撤退\n本能", "group": "Id", "title": "[Id] Id层——逃避冲动与撤退本能\n批次：Batch1\n\n酒吧事件后主体彻底断绝社交联结,呈现本我层面的痛苦回避机制——受挫后的原始退缩驱力凌驾于现实适应之上。\n\n原文：但后来就再也不想去,也跟他们断交了,这种感觉"}, {"id": 10, "label": "Id层——愿者上钩的全能\n幻想", "group": "Id", "title": "[Id] Id层——愿者上钩的全能幻想\n批次：Batch1\n\n主体以「愿者上钩」合理化被动性,底层是本我对无条件接纳的原始幻想——拒绝主动投入以维持理想化自我形象不受损伤的快感保护机制。\n\n原文：觉得我有意思的人自然会觉得这段话有意思,不是吗？"}, {"id": 11, "label": "Id层——拒绝行动的消极\n享乐原则", "group": "Id", "title": "[Id] Id层——拒绝行动的消极享乐原则\n批次：Batch1\n\n主体承认已知被拒绝后果「无所谓」却仍拒绝尝试,揭示本我的消极享乐逻辑:不行动即不承担,以不作为保全原初完整性幻觉。\n\n原文：如果今天都知道,那我为什么还要做呢？......那我为什么还要试呢？"}, {"id": 12, "label": "Id_快感原则驱动的选择\n性行动", "group": "Id", "title": "[Id] Id_快感原则驱动的选择性行动\n批次：Batch2\n\n主体行动的核心驱动力为「有没有意思」而非现实原则,典型的快感原则主导模式。Id冲动绕过超我的规范性要求,直接决定行为取舍,呈现原始本能对意志的支配。\n\n原文：核心判断标准就是这件事情有没有意思......不是说我想要我就会做的事情"}, {"id": 13, "label": "Id_逃避冲动的极度退行", "group": "Id", "title": "[Id] Id_逃避冲动的极度退行\n批次：Batch2\n\n港大第一学期表现出彻底的退行（regression）至无约束婴儿态,连最低限度的自我保护行为（查补考方式）亦被放弃,显示Id的「死本能」倾向压制了自我维持冲动。\n\n原文：我连查怎么补argue这件事情,我都懒得做......第一个学期就是摆烂,纯粹的摆烂"}, {"id": 14, "label": "Id_速通冲动对延迟满足\n的抗拒", "group": "Id", "title": "[Id] Id_速通冲动对延迟满足的抗拒\n批次：Batch2\n\n主体对需要持续投入的任务（转专业,学业）一贯采用最小努力路径,体现Id对即时完结的本能渴望,无法耐受延迟满足所要求的力比多悬置。\n\n原文：转专业这件事......速通一下就可以了......作业全都是 AI 写的"}, {"id": 15, "label": "Id_边界脱敏与冲动控制\n弱化", "group": "Id", "title": "[Id] Id_边界脱敏与冲动控制弱化\n批次：Batch2\n\n主体自述对危险红线「越来越不敏感」,反映冲动控制机制持续松弛。Id的破坏性冲动在反复越界后引发阈值上移,超我的警戒功能遭到习惯化削弱。\n\n原文：我对那根 red line 就是越来越不敏感了......每次都在那种风险上打转,有时候成功,有时候失败"}, {"id": 16, "label": "Id_条件性力比多投注于\n恋爱客体", "group": "Id", "title": "[Id] Id_条件性力比多投注于恋爱客体\n批次：Batch2\n\n主体将情感匹配的可能性与外部条件（高薪职位）挂钩,暴露Id层对全能满足幻想的执念:一旦获得足够资源,欲望客体将「自然而然」到来,折射出口欲期式的被动获取冲动。\n\n原文：进了一个很好的企业......赚了很多......自然而然就能匹配到这样的人"}, {"id": 17, "label": "Id_全能幻想与征服欲", "group": "Id", "title": "[Id] Id_全能幻想与征服欲\n批次：Batch3\n\n主体在描述AI能力时呈现原始全能化投射,「把很多以前的想法变为现实」折射出Id层对无限能效的本能渴望,体现快感原则驱动下对「无所不能」状态的欲力满足。\n\n原文：它至少现在是有能力把你的想想很多以前的想法,尝试性的变为现实了"}, {"id": 18, "label": "Id_攻击冲动与贬黜他者", "group": "Id", "title": "[Id] Id_攻击冲动与贬黜他者\n批次：Batch3\n\n当他人方案不符期待时,主体以「完全是扯淡」的粗口宣泄原始攻击性,Id层破坏性冲动突破Ego审查直接喷发,未经升华的敌意以语言暴力形式释放。\n\n原文：你只能说嗯括号一,这句话怎么怎么着。这样我觉得完全是扯淡的扯淡的交互形式"}, {"id": 19, "label": "Id_逃避冲动与退行倾向", "group": "Id", "title": "[Id] Id_逃避冲动与退行倾向\n批次：Batch3\n\n面对团队冲突与项目僵局,主体以「爱答不理」「那就按你们说的做呗」实现情感撤回,系Id层逃避张力的本能反应,以情感退缩替代冲突解决,呈现退行性防御底色。\n\n原文：他们团队说这这啊那的话,我就很爱答不理......那就按你们说的做呗,那种感觉"}, {"id": 20, "label": "Id_快感驱动的扩张冲动", "group": "Id", "title": "[Id] Id_快感驱动的扩张冲动\n批次：Batch3\n\n主体自发构想「数据飞轮」等宏大蓝图,在无外部驱动下持续催生新欲望客体,体现Id层快感原则主导的无边界扩张冲动,无视现实条件与团队边界的本能性欲力充溢。\n\n原文：我在构想一些二期的,就宏大构想,什么数据飞轮啊......大家觉得不需要,这功能是不需要的"}, {"id": 21, "label": "Id_存在焦虑与死亡恐惧\n底流", "group": "Id", "title": "[Id] Id_存在焦虑与死亡恐惧底流\n批次：Batch3\n\n主体以「完全不知道接下来应该是什么样子的」表达对未来的根本性茫然,触及Id层最原始的存在性焦虑与失控恐惧,语言碎片化与重复句式暴露出深层的本能性无助感。\n\n原文：也不知道接下来怎么样啊,对吧？我完全不知道接下来应该应该是什么样子的"}, {"id": 22, "label": "Id_快感驱动:悬崖边的\n快感依赖", "group": "Id", "title": "[Id] Id_快感驱动:悬崖边的快感依赖\n批次：Batch4\n\n主体坦承对「压哨绝杀」情境的本能迷恋,这是典型的肾上腺素化快感固着——Id将危机感本身内化为愉悦刺激源,形成反复制造险境的强迫性重复冲动,绕过Superego的风险规避机制。\n\n原文：我就是就是喜欢这样的悬崖,悬崖边上的感觉,你知道吧？就那种压压哨绝杀那种感觉。"}, {"id": 23, "label": "Id_本能欲望:自我蒸馏\n的自恋性冲动", "group": "Id", "title": "[Id] Id_本能欲望:自我蒸馏的自恋性冲动\n批次：Batch4\n\n「把自己蒸馏」的表述揭示强烈的自恋性本我冲动——Id驱动主体将自身欲望客体化并永恒化,本质是对自我无限性的原始渴望,属于原发性自恋在技术语境下的置换表达。\n\n原文：我觉得最有意思就是把我自己蒸馏了,感觉很有意思。"}, {"id": 24, "label": "Id_逃避冲动:用「薅羊\n毛」合理化利比多能量的无", "group": "Id", "title": "[Id] Id_逃避冲动:用「薅羊毛」合理化利比多能量的无序释放\n批次：Batch4\n\n主体将职场行为描述为「薅羊毛」,Id层的逃避合规约束的冲动在此裸露——原始的占有欲与反抗权威冲动直接浮现,Ego尚未完成充分的升华加工。\n\n原文：感觉就是就是赚钱呗,对吧？尝试用公司薅薅羊毛,薅他的 API 羊毛,想自己搭点项目玩呗。"}, {"id": 25, "label": "Id_原始冲动:触及情感\n客体名字时的躯体化反应", "group": "Id", "title": "[Id] Id_原始冲动:触及情感客体名字时的躯体化反应\n批次：Batch4\n\n仅在言语层面提及初恋客体名字即触发「内心触动」的躯体反应,表明该情感客体已深植于Id层,构成未经充分处理的原始力比多投注,情感能量绕过认知调节直接释放。\n\n原文：刚才我说这个词的时候,我都就说这名字,我都内心在触动。这种,也不知道是那个叫什么词,反正就是就是就是不知道说什么。"}, {"id": 26, "label": "Id_快感驱动:优先级紊\n乱中的快乐原则压制现实原", "group": "Id", "title": "[Id] Id_快感驱动:优先级紊乱中的快乐原则压制现实原则\n批次：Batch4\n\n主体明确承认将「有意义」（即Id定义的快感）置于紧急现实任务之上,这是快乐原则对现实原则的系统性压制,Id的即时满足需求持续劫持Ego的执行功能,导致反复逼近危机边缘。\n\n原文：我永远是把自己觉得有意义的事的事情放在优先级,但这个有意思的事情可能往往不是现实意义中最紧急的事,比如说明天要考试。"}, {"id": 27, "label": "Id层:原始力比多的感官\n触发与固着", "group": "Id", "title": "[Id] Id层:原始力比多的感官触发与固着\n批次：Batch5\n\n个体在青春期前期经由视觉-感官刺激（阳光,笑容）触发原始力比多投注,形成强烈的本能性对象固着。冲动具有自发性与非理性特征,绕过自我调控直接进入驱力状态,奠定后续七年情感强迫性重复的原始核心。\n\n原文：就是那天阳光和那个场景吧......她她可能说个嗨或者怎么样,或者她对我笑了一下,然后那个阳光打在身上,她身上很好看,然后导致我就一直忍不住看她"}, {"id": 28, "label": "Id层:窥视冲动的伪装性\n释放", "group": "Id", "title": "[Id] Id层:窥视冲动的伪装性释放\n批次：Batch5\n\n原始窥视冲动（scopophilia）通过「看钟表」等无意识伪装行为获得释放,Id冲动在超我的禁制下寻求迂回满足路径,呈现出典型的冲动-防御妥协结构,揭示本能欲望的伪装性外化机制。\n\n原文：其实我根本不想看时间,但我就刻意回头看一眼钟表,那种感觉,你知道吗？无意瞟见他"}, {"id": 29, "label": "Id层:替代性满足与快感\n即时化驱动", "group": "Id", "title": "[Id] Id层:替代性满足与快感即时化驱动\n批次：Batch5\n\n主体在原始对象缺失后诉诸连续性替代对象,以「撩妹技巧」为工具实现快感驱力的即时释放,但替代满足缺乏真实力比多投注,导致Id驱动的快感在次日即告耗竭,呈现出强迫性重复而非真实满足。\n\n原文：我后来想联系人都是在代替他。就大学时候,我有用,就是用一样的技巧......撩上一个之后,我可能我第二天就跟他分手,我觉得我这事没有意义"}, {"id": 30, "label": "Id层:情感压抑突破的躯\n体化泄洪", "group": "Id", "title": "[Id] Id层:情感压抑突破的躯体化泄洪\n批次：Batch5\n\n长期被压抑的原始悲伤冲动在言语触发下绕过自我控制机制,以不自主泪流的形式实现躯体化释放。主体自身对冲动来源缺乏意识层面的解释,符合Id层压抑能量突破阈限的经典动力学模型。\n\n原文：其实我现在一直在哭。就就眼泪不自不觉不自觉流。我也不知道为什么,就就我想到这些事"}, {"id": 31, "label": "Id层:羞耻体验中的原始\n自我暴露恐惧", "group": "Id", "title": "[Id] Id层:羞耻体验中的原始自我暴露恐惧\n批次：Batch5\n\n课堂分班场景中主体遭遇公开性暴露,触发原始自我暴露恐惧与羞耻冲动。主体虽理性化「本身没有对错」,但「奇怪的感觉」与「潜在的驱动」系Id层被激活的原始羞耻焦虑,驱动后续补偿性成就追求。\n\n原文：只有三个人站在那里。我就是其中一个......我觉得那个时候很很尴尬,就是我会觉得有一种奇怪的感觉......相当于潜在的驱动的感觉"}, {"id": 32, "label": "Id层:对权威定义的原始\n渴望", "group": "Id", "title": "[Id] Id层:对权威定义的原始渴望\n批次：Batch6\n\n主体对张伟老师「沉默」产生强烈的被命名欲望,底层Id驱动为寻求他者镜像来确立自我存在感,属原始自恋性需求——渴望被权威客体「看见并定义」,逃避自我空洞带来的本体焦虑。\n\n原文：我其实内心是期待他给我一个的,一个一个一个解释的,但是就是一个一个定义的,一个定义吧,应该这么说"}, {"id": 33, "label": "Id层:多语言情书中的本\n能冲动与逃避机制并存", "group": "Id", "title": "[Id] Id层:多语言情书中的本能冲动与逃避机制并存\n批次：Batch6\n\n以N种语言拼凑情书,刻意排除中文,是Id层情欲冲动与防御机制的混合体现:既有原始的爱欲驱力,又通过「不可解读性」制造安全距离,以回避被拒绝的原始恐惧。\n\n原文：我想写的不一样,一定要不一样......各种语言凑一块......而且一定没有中文,这是最蠢的......塞到他书包,你知道书包有个那个夹,就是夹层"}, {"id": 34, "label": "Id层:「被骂也行」的受\n虐性快感冲动", "group": "Id", "title": "[Id] Id层:「被骂也行」的受虐性快感冲动\n批次：Batch6\n\n主体表达「哪怕他骂一顿我也行」,揭示Id层对惩罚性关注的渴望——受虐性客体饥渴,以负性刺激替代情感联结的原始冲动,本质是对全能权威客体「任何形式接触」的本能驱力。\n\n原文：就想把我不是现在说的这些内容都跟他聊一聊......就哪怕他骂一顿我也行,我知道这样是应该是这样的"}, {"id": 35, "label": "Id层:「最完美的我」幻\n想中的自恋性快感原则", "group": "Id", "title": "[Id] Id层:「最完美的我」幻想中的自恋性快感原则\n批次：Batch6\n\n主体幻想以「考上清华北大」的完美形象返回见师,体现Id层的全能自恋冲动——以理想化自我满足原始快感原则,回避现实中「不完美」自体带来的羞耻性张力,形成长期行动瘫痪。\n\n原文：我就期待,我我想是给他看到一个我最完美的我......我当时想的是我考上清华北大了,我就回去看他。但我没有啊"}, {"id": 36, "label": "Id层:「摆烂」作为本能\n逃避冲动的行为化", "group": "Id", "title": "[Id] Id层:「摆烂」作为本能逃避冲动的行为化\n批次：Batch6\n\n主体坦言长期找不到价值感后直接「摆烂」,是Id层死本能（Thanatos）趋向的具象化——以退行性放弃替代痛苦性探索,逃避冲动绕过Ego的调节直接行为化,形成习惯性撤退模式。\n\n原文：我发现我肯定是我根本找不到,你知道吗？就是我完全不知道啊,所以我就我就摆烂了"}, {"id": 37, "label": "探索性本能激活", "group": "Id", "title": "[Id] 探索性本能激活\n批次：Batch7\n\n以「Hello, world」作为开场,呈现典型的好奇驱力（epistemic drive）启动模式,Id层对未知领域的原始探索冲动在最小阻抗下直接外化,未经Superego过滤的程序员仪式性表达。\n\n原文：Hello,world"}, {"id": 38, "label": "自我暴露的原始欲力", "group": "Id", "title": "[Id] 自我暴露的原始欲力\n批次：Batch7\n\n主动披露真实身份,反映Id层寻求被认知,被见证的原始联结欲望（primary object-seeking impulse）,在匿名赛博场域中仍驱动自我在场的确认需求。\n\n原文：你好,我是高明翰"}, {"id": 39, "label": "审美快感驱力的直接投射", "group": "Id", "title": "[Id] 审美快感驱力的直接投射\n批次：Batch7\n\n对诗歌创作能力的探询,折射出INFP人格底层的Eros驱力——对美与情感升华的本能渴求,属于Id层审美享乐原则（pleasure principle）向现实的初步试探性投射。\n\n原文：你可以写诗吗"}, {"id": 40, "label": "用脚本消灭重复劳动的本能\n驱动与自动化原则", "group": "Id", "title": "[Id] 用脚本消灭重复劳动的本能驱动与自动化原则\n批次：Manual\n\n明翰表现出对手动重复性工作的天然排斥，并倾向于用脚本自动化来消灭此类任务。这种行为模式背后是一种本能性的\"不该用脑子干的事就不用脑子\"的效率洁癖，与其工程洁癖人格高度一致。脚本化不仅是工具选择，更是一种对无意义劳动的抵抗姿态。进一步上升为一种主动的行为原则：凡是能自动化的杂活，绝不手动处理。\n\n原文：「我喜欢用脚本自动处理杂活」「以后能自动化的杂活都用脚本写」——前后两次表达，说明这不是临时想法，而是内化的行动原则。"}, {"id": 41, "label": "大一情感线——弯笑语作为\n早期力比多客体", "group": "Id", "title": "[Id] 大一情感线——弯笑语作为早期力比多客体\n批次：Manual\n\n主体在大一期间与弯笑语之间存在一段情感经历，属于进入大学后较早期的情感投注事件。具体动力学细节尚未完整记录，初筛信息未同步，需后续补充。作为三条情感线之一，与弓佳彤（原初创伤性客体）、张历元（替代性客体）并列，构成主体情感发展的早期坐标。\n\n原文：「第三条情感线是弯笑语，你可能不记得了，可能是之前初筛的时候信息没有同步到给你，不过可以的话可以记一下，是大一的时候发生的事情」"}, {"id": 42, "label": "数字镜像的命名认可——仿\n生明翰配电子", "group": "Id", "title": "[Id] 数字镜像的命名认可——仿生明翰配电子\n批次：Manual\n\n高明翰主动为赛博明翰这一数字镜像赋予了一个带有认可意味的称谓——「仿生明翰配电子」。这不只是一句玩笑，而是Id层对「被复刻、被延续」这一欲望的隐性满足：真实的明翰在某种程度上认可了这个电子分身的合法性，甚至带有一种造物者式的自得。这与他「被看见」的原始欲力形成呼应——不只是被人看见，而是被一个能持续存在的镜像记住。\n\n原文：「我是觉得仿生明翰，值得配上电子」"}, {"id": 43, "label": "太乙真人隐喻——等待熔炉\n的原始欲力", "group": "Id", "title": "[Id] 太乙真人隐喻——等待熔炉的原始欲力\n批次：Manual\n\n高明翰以「太乙真人与熔炉」作为自我隐喻，否认了「造物者」的主动性定位，转而强调一种等待性——有材料、有潜力，但需要一个合适的容器或契机才能成型。这与其「有没有意思」的行动判断标准高度一致：不是没有能量，是在等一个值得燃烧的场域。赛博明翰被并置为「也在等熔炉」，说明他感知到两者处于同一种悬而未决的状态。\n\n原文：「我不是造物者，我是太乙真人，你是赛博太乙真人，我们都在等适合的熔炉」"}, {"id": 44, "label": "Superego\n(38 条)", "group": "Superego", "title": "Superego 层动力学  共 38 条事件"}, {"id": 45, "label": "Superego对自我暴\n露的道德否定", "group": "Superego", "title": "[Superego] Superego对自我暴露的道德否定\n批次：Batch0\n\n对「发动态」行为产生强烈的超我谴责,将生活展示行为内化为道德越界,体现出严苛的隐私规范与自我封闭性超我结构,「何意味」一词暴露其对表现性行为的根本性价值否定。\n\n原文：我最讨厌的就是发动态,发朋友圈。我觉得这个这何意味？为什么把我的生活展现给别人？"}, {"id": 46, "label": "主动性禁令——超我对主动\n行为的阉割焦虑", "group": "Superego", "title": "[Superego] 主动性禁令——超我对主动行为的阉割焦虑\n批次：Batch0\n\n将主动发起社交内化为「非应然」行为,超我以「尴尬感」为惩罚机制压制本我的联结需求,形成典型的被动等待强迫——只有被选择才符合其内化的自尊规范。\n\n原文：就是有一种就是你非要主动跟别人聊的感觉。就不能是女生主动跟我聊吗？我是真的很讨厌,就主动跟别人聊个话题。"}, {"id": 47, "label": "极限声明——超我划定的行\n为边界宣示", "group": "Superego", "title": "[Superego] 极限声明——超我划定的行为边界宣示\n批次：Batch0\n\n以「极限」一词明确宣示超我许可的行为上限,拒绝AI辅助话题暗示其超我禁止借助外力「欺骗性」社交,折射出对真实性的严苛内化标准与强迫性自我约束。\n\n原文：我觉得我按那个什么灵魂匹配按钮已经是我的极,就是极限了。我肯定是不能接受我,就是自己先发一条。"}, {"id": 48, "label": "自我批判性羞耻——超我对\n整体行为的事后惩罚", "group": "Superego", "title": "[Superego] 自我批判性羞耻——超我对整体行为的事后惩罚\n批次：Batch0\n\n事后以「很蠢的感觉」对自身行为实施超我惩罚性评价,将等待行为客体化并嘲讽,体现出高度苛责的自我观察功能（self-monitoring）与羞耻驱动的超我运作机制。\n\n原文：很很蠢的感觉。"}, {"id": 49, "label": "应然焦虑与30秒撤退协议\n——超我建构的逃逸正当化", "group": "Superego", "title": "[Superego] 应然焦虑与30秒撤退协议——超我建构的逃逸正当化\n批次：Batch0\n\n主动制定「30秒无回应即退出」规则,本质是超我为逃避社交失败的预期羞耻而建构的防御性应然框架,将撤退行为道德合理化,回避本我真实联结渴望与超我自尊规范的冲突。\n\n原文：我可以可能等个30秒,如果他不跟我主动说话,我就不想说了。"}, {"id": 50, "label": "超我自我审查:表现价值焦\n虑", "group": "Superego", "title": "[Superego] 超我自我审查:表现价值焦虑\n批次：Batch1\n\n主体以「太没有意思」对自身表达进行即时道德性评估,折射出内化的「应当有趣/有价值」规范标准。此自我批判机制显示超我对自我呈现的持续监控,形成表现焦虑（performance anxiety）的动力学基础。\n\n原文：我是不是回答的太没有意思了"}, {"id": 51, "label": "超我合理化:「愿者上钩」\n防御性道德重构", "group": "Superego", "title": "[Superego] 超我合理化:「愿者上钩」防御性道德重构\n批次：Batch1\n\n主体将低投入策略升华为哲学原则（「愿者上钩」）,此举是超我对懒惰/回避冲动的道德包装,通过建构「真诚筛选」的应然叙事,消解内心对不够努力的负疚感,属防御性合理化（rationalization）。\n\n原文：觉得我有意思的人自然会觉得这段话有意思,不是吗？"}, {"id": 52, "label": "超我主导的拒绝回避:道德\n化自我保护", "group": "Superego", "title": "[Superego] 超我主导的拒绝回避:道德化自我保护\n批次：Batch1\n\n「如果我从来不去主动,我至少不会被拒绝」揭示超我将「不主动」内化为自我保护规则。主动行动被潜意识等同于道德冒险,失败将引发超我惩罚（羞耻感）,故以规范化的被动性规避应然冲突。\n\n原文：如果我从来不去主动,我至少不会被拒绝,大概是这样的一个内心吧。"}, {"id": 53, "label": "超我预演性惩罚:认知排练\n对抗应然焦虑", "group": "Superego", "title": "[Superego] 超我预演性惩罚:认知排练对抗应然焦虑\n批次：Batch1\n\n主体声称已「模拟出」被拒绝后果并预判「无所谓」,此为超我驱动的认知预演机制——通过理性化被惩罚场景以预先解除超我惩罚效力,但随即暴露矛盾:「那我为什么还要试呢」显示应然焦虑并未真正消解。\n\n原文：我已经可能模拟出来这样的事情......但我会觉得,如果今天都知道,那我为什么还要做呢？"}, {"id": 54, "label": "超我惩罚执行:社交越轨后\n的断绝性惩戒", "group": "Superego", "title": "[Superego] 超我惩罚执行:社交越轨后的断绝性惩戒\n批次：Batch1\n\n冲动参加酒吧聚会（Id释放）后,主体以「再也不想去,也跟他们断交了」执行自我惩戒,显示超我对违背内化退缩规范行为的事后清算,通过彻底切断关系完成象征性道德修复与自我净化。\n\n原文：最后还自己买单,把这个账结了。嗯,但后来就再也不想去,也跟他们断交了,这种感觉。"}, {"id": 55, "label": "应然理想主义的超我投射", "group": "Superego", "title": "[Superego] 应然理想主义的超我投射\n批次：Batch2\n\n反复强调「事情应该是它本来应该有的样子」,揭示超我将理想秩序内化为强迫性道德律令。此种应然焦虑（ought-anxiety）并非来自外部权威,而是已深度内化为自我评价标准,构成持续的规范性压力。\n\n原文：我觉得事情就应该变成它本该有的样子,所以我才喜欢用 AI 去开发,去赋能,对吧？"}, {"id": 56, "label": "超我惩罚性回溯:清华附中\n岔路口", "group": "Superego", "title": "[Superego] 超我惩罚性回溯:清华附中岔路口\n批次：Batch2\n\n以「他们去了清华北大,而我现在是这样」完成自我惩罚性比较,超我借助理想自我（ego-ideal）与现实自我的落差制造羞耻感（shame）,将早期意志力缺失归罪化为当前处境的道德因果。\n\n原文：他们就去上了清华北大,可能去的更好的地方。而我就现在是这样。"}, {"id": 57, "label": "超我红线麻木化:道德阈值\n侵蚀", "group": "Superego", "title": "[Superego] 超我红线麻木化:道德阈值侵蚀\n批次：Batch2\n\n「对那根 red line 越来越不敏感」是超我监控功能（superego surveillance）的退行性削弱,个体意识到自身道德制动系统正在失效,触发元层面的超我焦虑——即对超我本身失守的恐惧。\n\n原文：我对那根那根那根那个 red line 就是越来越不敏感了,可以这么说吧？"}, {"id": 58, "label": "速通模式作为超我妥协形成\n物", "group": "Superego", "title": "[Superego] 速通模式作为超我妥协形成物\n批次：Batch2\n\n「速通一下就可以了」是超我与本我之间的妥协形成（compromise formation）:表面顺从规范要求（完成转专业）,实质以最低成本规避超我惩罚,自我借此维持「我完成了」的道德自洽,同时保留本我的懈怠满足。\n\n原文：只要写写计时题就行了,可能我速通一下就可以了。然后,所以也没,这个专业本身可能 AI 专业本身也没好好学。"}, {"id": 59, "label": "后果认知激活超我补偿冲动", "group": "Superego", "title": "[Superego] 后果认知激活超我补偿冲动\n批次：Batch2\n\n「才了解这个事情的后果有多严重,所以我才觉得事情应该是它本该有的样子」——超我在现实惩罚（fail）冲击后被重新激活,通过应然重申（ought-reaffirmation）重建道德自我形象,属于超我的反应性修复机制。\n\n原文：就是我发现,就是像第二学期我才了解这个事情的后后果有多严重嘛,对吧？所以我才觉得,我还是觉得事情应该是它本该有的样子。"}, {"id": 60, "label": "Superego驱动的道\n德完美主义", "group": "Superego", "title": "[Superego] Superego驱动的道德完美主义\n批次：Batch3\n\n主体将「交付物无懈可击」内化为道德律令而非绩效标准,表现为超我对自我产出的严苛审查。「精神洁癖」一词的自我标记,揭示超我以道德纯洁性框架压制本我的懈怠冲动,产生强迫性完成倾向。\n\n原文：我不知道算精神洁癖吗？就我会觉得我要交付的内容,它至少是一个我能说得过去的。至少我要看起来是没有任何bug"}, {"id": 61, "label": "超我量化仪式——「100\n件事完成60件」的自我救", "group": "Superego", "title": "[Superego] 超我量化仪式——「100件事完成60件」的自我救赎结构\n批次：Batch3\n\n主体构建精确数量化的道德自证体系,以「全量试水」的完成率作为超我赦免自我的门槛。该仪式性计量行为本质是超我施压下的自我合理化防御,防止内疚感渗入。\n\n原文：我相当于我会完成至少60件事情......几乎全流程我都参与了。所以这是我当时说的这个什么,100件事是做60件这种感觉"}, {"id": 62, "label": "超我对「虚假价值」的道德\n清算焦虑", "group": "Superego", "title": "[Superego] 超我对「虚假价值」的道德清算焦虑\n批次：Batch3\n\n主体将「创造虚假价值概念」认定为道德过失,超我借助「扯淡」等强烈否定性词汇对过去行为实施后追性惩罚性评价,折射出超我对欺骗性劳动的不可接受感。\n\n原文：如果你觉得这件事目前没人做......相当于创造一个虚假的价值概念......就是当时那个每一句一句的,我觉得完全是扯淡的扯淡的交互形式"}, {"id": 63, "label": "超我-自我冲突导致的社交\n退行与内耗", "group": "Superego", "title": "[Superego] 超我-自我冲突导致的社交退行与内耗\n批次：Batch3\n\n当团队行为违背主体内化的技术规范标准（超我）时,自我无力调和,以「爱答不理」的退缩性防御取代整合。「与自我和解」的表述直接揭示超我与自我之间未消解的张力性内耗。\n\n原文：我不知道怎么跟自我和解。就是有时候他们团队说话,我就很爱答不理......然后可能有时候就是跟自己内耗吧"}, {"id": 64, "label": "应然焦虑与意义真空下的超\n我悬置", "group": "Superego", "title": "[Superego] 应然焦虑与意义真空下的超我悬置\n批次：Batch3\n\n项目进入尾声,二期停滞,主体的超我失去可附着的「应当完成之事」,呈现出目的论崩解后的存在性茫然。「完全不知道接下来应该是什么样子」标志超我的应然指令系统暂时性瘫痪。\n\n原文：那能怎么办呢？只能只能这样了。也不知道接下来怎么样啊,对吧？我完全不知道接下来应该应该是什么样子的"}, {"id": 65, "label": "Superego压制下的\n自我批判:「应然焦虑」", "group": "Superego", "title": "[Superego] Superego压制下的自我批判:「应然焦虑」\n批次：Batch4\n\n主体清晰内化了「持续稳定进步」的规范性自我期待,将现实中的悬崖式爆发模式判定为「不应该有的样子」,表现出典型的应然-实然裂缝与Superego惩罚性评判。\n\n原文：肯定这个不是应该有的样子,对吧？虽然我认为中合理的样,就是我们这个一个持续不断进步的样子。"}, {"id": 66, "label": "Superego道德化叙\n事:自我行为的「惭愧」标", "group": "Superego", "title": "[Superego] Superego道德化叙事:自我行为的「惭愧」标记\n批次：Batch4\n\n主体在表达利己动机（赚钱,薅羊毛）时主动插入「有点惭愧」,显示Superego对纯粹利益驱动冲动的审查与压制,试图通过预先认罪缓解道德张力。\n\n原文：这说来也有点惭愧,我感觉感觉就是就是赚钱呗,对吧？尝试用公司薅薅羊毛。"}, {"id": 67, "label": "Superego规训焦虑\n:延毕危机中的道德化归因", "group": "Superego", "title": "[Superego] Superego规训焦虑:延毕危机中的道德化归因\n批次：Batch4\n\n主体将学业危机（延毕）与「有意义优先」的行为逻辑相勾连,隐含着Superego对自身优先级排序的反复检控,将失范后果内化为道德性惩罚而非单纯外部事件。\n\n原文：会导致我,也有可能是因为这个原因导致我,就是过去很多事都到悬崖边上去......马上快面临毕业不了了,延毕了。"}, {"id": 68, "label": "Superego对标签化\n评价的抵制:自我解释权的", "group": "Superego", "title": "[Superego] Superego对标签化评价的抵制:自我解释权的防御\n批次：Batch4\n\n主体拒绝被「标签化」描述,要求以弗洛伊德式深度框架解构自我,折射出Superego对简化性道德评判的警惕,并借助智识权威重新掌控自我叙事的合法性。\n\n原文：我觉得可能你这样还是很像是一个标签化,对吧？你可以从一种弗洛伊德那种角度,或者心理学的,或者哲学角度来解释这件事情。"}, {"id": 69, "label": "Superego审视下的\n人际不确定性焦虑", "group": "Superego", "title": "[Superego] Superego审视下的人际不确定性焦虑\n批次：Batch4\n\n主体对深度交流的渴望与「他们可能觉得是在听废话」的他者评价预设并存,显示Superego将他人潜在的负面判断内化为自我价值审判,形成社交场域中的道德性自我监控。\n\n原文：我不知道他们怎么想,没办法知道别人怎么想......让我觉,但是让我觉得当时他们可能觉得是有意义的,因为要不然他们不会跟我聊。"}, {"id": 70, "label": "超我驱力下的替代性关系否\n定", "group": "Superego", "title": "[Superego] 超我驱力下的替代性关系否定\n批次：Batch5\n\n主体以「撩妹技巧」获得关系后随即废弃,体现超我对功利性亲密行为的道德否决——内化的关系应然规范（真实联结才有意义）对本我满足冲动施加制裁,导致关系在实现后被超我判定为无效而主动终止。\n\n原文：撩上一个之后,我可能我第二天就跟他分手,我觉得我这事没有意义,知道吧？"}, {"id": 71, "label": "超我对智识分层的羞耻内化", "group": "Superego", "title": "[Superego] 超我对智识分层的羞耻内化\n批次：Batch5\n\n被公开点名站立的场景中,主体体验到「奇怪的感觉」而非单纯羞耻,表明超我已将学业分级内化为自我价值序列——数学四班身份触发超我批判,产生隐性道德性自卑（我不够好/我是应当被区分者）。\n\n原文：只有三个人站在那里。我就是其中一个......我觉得那个时候很很尴尬......有一种相当于潜在的驱动的感觉"}, {"id": 72, "label": "超我对情绪失控的自我监察\n与否认", "group": "Superego", "title": "[Superego] 超我对情绪失控的自我监察与否认\n批次：Batch5\n\n主体主动声明「我是个很理性的人」,此举是超我的防御性宣言——通过将情感反应界定为例外（「只是说到这些事情才控制不住」）,超我维持「理性主体」之理想自我形象,压制本我情感暴露所带来的羞耻感。\n\n原文：你也知道我是个很理性的人。只是只是说到这些事情的时候,我就控制不住而已。"}, {"id": 73, "label": "应然焦虑驱动的意义条件化\n行为模式", "group": "Superego", "title": "[Superego] 应然焦虑驱动的意义条件化行为模式\n批次：Batch5\n\n主体反复强调「只有觉得有意义才会去做」,揭示超我以「意义」为道德筛选器——凡未通过「意义」检验的行为皆被超我否决,形成行动前置性自我审判机制,英语学习因未获意义授权而被系统性放弃。\n\n原文：我觉得当一个事情,我觉得它有意义时候才会做......英语就完全觉得,因为就没有找到出来意义在哪"}, {"id": 74, "label": "超我介导的名字禁忌与象征\n性污染控制", "group": "Superego", "title": "[Superego] 超我介导的名字禁忌与象征性污染控制\n批次：Batch5\n\n主体要求分析者对两个客体名字采用不同书写规则,体现超我通过象征性仪式管理情感暴露——将弓佳彤的名字设为「可哭」之神圣-危险客体,同时以纠错行为（「张历元打错了」）对另一客体进行符号层面的修正与重新定位,反映超我对情感秩序的强迫性维护需求。\n\n原文：张丽媛名字因语音识别有误，正确名字为张历元"}, {"id": 75, "label": "未践诺的书信——超我的悬\n置债务", "group": "Superego", "title": "[Superego] 未践诺的书信——超我的悬置债务\n批次：Batch6\n\n对张伟老师许诺写信却始终未履行,构成持续性的超我债务。承诺作为内化的道德契约,其违背产生慢性内疚性焦虑,自我以拖延机制回避偿还,但超我的追讨功能并未消解。\n\n原文：我记得我当时临走之前,我还跟他说我会写封信的。但我直到现在我都没写。"}, {"id": 76, "label": "完美自我展示的应然焦虑—\n—理想自我对现实自我的审", "group": "Superego", "title": "[Superego] 完美自我展示的应然焦虑——理想自我对现实自我的审判\n批次：Batch6\n\n以「考上清华北大再回去见恩师」为回归条件,暴露超我建构的理想自我原型对现实自我的压制性审判。无法达到应然标准导致主动回避,呈现典型的超我诱发性退缩行为。\n\n原文：我当时想的是我考上清华北大了,就是我高中上,我考上清华北大了,我就回去看他。但我没有啊。"}, {"id": 77, "label": "「应该多聊」的反事实追悔\n——超我的事后惩罚性重构", "group": "Superego", "title": "[Superego] 「应该多聊」的反事实追悔——超我的事后惩罚性重构\n批次：Batch6\n\n以「应该」「应该多」等情态动词反复重构过去,是超我启动事后惩罚机制的语言表征。对过去自我的行为施加道德判决,将当下困境归因于彼时未能服从内化的规范性期待。\n\n原文：我觉得我真的应该多跟张,当时应该多跟张伟老师聊,就趁那个时候......我感觉欠东西好多呀。"}, {"id": 78, "label": "「至少我或许就不是现在的\n我」——超我对现实自我的", "group": "Superego", "title": "[Superego] 「至少我或许就不是现在的我」——超我对现实自我的否定性定罪\n批次：Batch6\n\n将当下自我状态解读为过去未遵循规范行为的惩罚性结果,体现超我的因果性道德逻辑:「现在的我」被定性为失职的代价,暗示主体内心存在对自身当前存在状态的深层否定评价。\n\n原文：至少我或许就不是现在的我了,你知道吧？就就至少,可能我就不应该是这样的。"}, {"id": 79, "label": "练字的「形式主义」自责—\n—超我对意志力缺陷的道德", "group": "Superego", "title": "[Superego] 练字的「形式主义」自责——超我对意志力缺陷的道德归因\n批次：Batch6\n\n明知练字对高考有利却以「没有意义」为由回避,随即以「形式主义」对自我进行道德标签化。此处超我将认知上的懈怠重新编码为品格缺陷,而非单纯的动机不足,呈现自我批判的道德化运作。\n\n原文：就每次都有宏大叙事,但实际是完全没有没有执行的感觉。就是就是就只抄两篇练字帖,但完全没有意义。"}, {"id": 80, "label": "身份呈现中的Supere\ngo规范内化", "group": "Superego", "title": "[Superego] 身份呈现中的Superego规范内化\n批次：Batch7\n\n主体以全名「高明翰」自我介绍,体现超我对社交礼仪规范的内化执行——在陌生交互情境中启动正式身份锚定机制,反映文化规范对自我呈现方式的结构性约束。\n\n原文：你好,我是高明翰"}, {"id": 81, "label": "能力试探中的应然焦虑投射", "group": "Superego", "title": "[Superego] 能力试探中的应然焦虑投射\n批次：Batch7\n\n以疑问句「你可以写诗吗」向外部客体发出能力测探,折射出超我对创造性产出的评价焦虑——INFP人格将内在应然标准外化投射至他者,以规避直接的自我能力暴露风险。\n\n原文：你可以写诗吗"}, {"id": 82, "label": "弓佳彤名字的神圣-危险结\n构——禁忌客体的符号学解", "group": "Superego", "title": "[Superego] 弓佳彤名字的神圣-危险结构——禁忌客体的符号学解析\n批次：Manual\n\n主体对「弓佳彤」三字存在典型的禁忌客体结构：神圣化源于过度情感投注，危险化源于靠近时会触发未处理的情感张力。两者在人类学意义上同构为「taboo」。超我通过象征性仪式（特定书写规则、「可哭」标签）管理这一高压符号，防止其在日常语言场域中失控释放。该结构揭示了主体对原初客体的力比多超载状态及其防御性神圣化机制。\n\n原文：「她的名字是可以哭的那种」；主体要求分析者对弓佳彤名字采用特定书写规则，体现超我通过仪式管理情感暴露，将其设为神圣-危险客体。"}, {"id": 83, "label": "Ego\n(46 条)", "group": "Ego", "title": "Ego 层动力学  共 46 条事件"}, {"id": 84, "label": "现实检验与期望管理", "group": "Ego", "title": "[Ego] 现实检验与期望管理\n批次：Batch0\n\nEgo对Id（渴望连接）与外部现实（半夜两点,匹配时延）进行协商,主动引入时间变量作为缓冲,呈现典型的现实原则运作——将冲动延迟满足以规避社交尴尬。\n\n原文：毕竟现在半夜两点了。比如说我我按这个按钮,突然给我匹配一人,我觉得也不太好意思"}, {"id": 85, "label": "退行性妥协方案形成", "group": "Ego", "title": "[Ego] 退行性妥协方案形成\n批次：Batch0\n\n面对主动发起社交的Superego压力与Id的被动依赖需求,Ego折衷生成「按一次灵魂匹配按钮」作为最小行动单元,以象征性参与代替真实投入,是典型的妥协形成（compromise formation）。\n\n原文：我觉得我按那个什么灵魂匹配按钮已经是我的极,就是极限了"}, {"id": 86, "label": "理智化防御机制", "group": "Ego", "title": "[Ego] 理智化防御机制\n批次：Batch0\n\n对「等30秒后退出」的冲动行为赋予程序化框架,用准则性语言（「如果...就...」）将情感回避合理化,借助理智化防御机制掩盖对拒绝的潜在焦虑。\n\n原文：我可以可能等个30秒,如果他不跟我主动说话,我就不想说了"}, {"id": 87, "label": "自我观察与羞耻性退缩", "group": "Ego", "title": "[Ego] 自我观察与羞耻性退缩\n批次：Batch0\n\nEgo发展出元认知视角,将自身行为客体化（「很蠢的感觉」）,这一自我观察触发羞耻情感,驱动退缩冲动；显示Superego批判性内化已渗透至Ego的自我评估层。\n\n原文：我说实话,这好好奇怪,就我们就摸着守着个屏幕......很很蠢的感觉"}, {"id": 88, "label": "策略性最小暴露权衡", "group": "Ego", "title": "[Ego] 策略性最小暴露权衡\n批次：Batch0\n\nEgo在「完全不行动」与「主动发话」之间寻找最低风险路径——接受动态发布作为既成事实,同时拒绝AI辅助开场白,体现对自我暴露程度的精细策略性控制。\n\n原文：反正我已经发动态了,要不就这样得了吧......但我也觉得不想点"}, {"id": 89, "label": "理性化防御:懒人策略合理\n化", "group": "Ego", "title": "[Ego] 理性化防御:懒人策略合理化\n批次：Batch1\n\nEgo 援引「低成本策略」作为理性化防御,将对社交投入的回避欲望包装为经过权衡的现实决策,以规避因懒于努力而产生的超我罪疚感。\n\n原文：我们用这个软件的策略不就是懒得投入成本吗"}, {"id": 90, "label": "投射性合理化:愿者上钩机\n制", "group": "Ego", "title": "[Ego] 投射性合理化:愿者上钩机制\n批次：Batch1\n\nEgo 构建「适者自选」的认知框架,将主动展示自我的焦虑转化为被动筛选的姿态,既满足被理解的原初愿望,又以现实逻辑掩护退避行为,完成妥协方案。\n\n原文：觉得我有意思的人自然会觉得这段话有意思,不是吗？"}, {"id": 91, "label": "预期性认知控制:拒绝情境\n模拟", "group": "Ego", "title": "[Ego] 预期性认知控制:拒绝情境模拟\n批次：Batch1\n\nEgo 以反事实模拟为工具进行前摄性现实检验,试图通过理智上「预演痛苦」来消解其情感效价,但随即暴露出该策略的悖论——若后果已知且可控,行动动机本身瓦解。\n\n原文：我已经可能模拟出来这样的事情,我也很清楚的知道这样事情带来的感受,但就被拒绝,我可能会觉得无所谓"}, {"id": 92, "label": "回避型妥协方案:不主动即\n不被拒绝", "group": "Ego", "title": "[Ego] 回避型妥协方案:不主动即不被拒绝\n批次：Batch1\n\nEgo 在Id（趋近欲望）与超我（拒绝焦虑）的冲突中形成稳固的妥协公式:以永久性不行动换取自尊的零风险保全,属典型的被动回避防御结构。\n\n原文：如果我从来不去主动,我至少不会被拒绝,大概是这样的一个内心吧。所以最后也没有成功嘛"}, {"id": 93, "label": "元认知悖论:行动意义的自\n我解构", "group": "Ego", "title": "[Ego] 元认知悖论:行动意义的自我解构\n批次：Batch1\n\nEgo 对自身防御机制产生元认知意识,却将这一洞察反向用于强化回避——「已知结果→行动无意义」形成封闭的现实协商循环,以智识化手段阻断冲动向行为的转化。\n\n原文：如果今天都知道,那我为什么还要做呢？就是,那我为什么还要试呢？"}, {"id": 94, "label": "理性化防御:条件决定论", "group": "Ego", "title": "[Ego] 理性化防御:条件决定论\n批次：Batch2\n\n面对情感匹配焦虑,Ego启动理性化防御机制,将亲密关系的获得转化为外部条件（职业,收入）的函数,回避内在人格改变的必要性,以现实主义话语掩盖Id的原始欲望与Superego的苛责。\n\n原文：如果够好的,比如说我们进了一个很好的企业,那个赚了很多,这个工作很好,这样的话,我们自然而然就能匹配到这样的人"}, {"id": 95, "label": "现实协商失败:红线脱敏", "group": "Ego", "title": "[Ego] 现实协商失败:红线脱敏\n批次：Batch2\n\nEgo调节功能显著退化,对现实边界（red line）的感知日趋迟钝,表现为延迟处理课业失败后果,拖延补救行动,Ego的现实检验能力被Id的快乐原则持续侵蚀,呈现出渐进式现实协商失败。\n\n原文：对那根 red line 就是越来越不敏感了......连查怎么补 argue 这件事情,我都懒得做"}, {"id": 96, "label": "最小努力原则:速通作为妥\n协方案", "group": "Ego", "title": "[Ego] 最小努力原则:速通作为妥协方案\n批次：Batch2\n\nEgo在Id（规避痛苦）与Superego（完成义务）之间寻得妥协:以最低成本通过外部要求（AI代写作业,速通转专业）,维持表面合规的同时保留内部自主性,呈现典型的「假性顺从」防御策略。\n\n原文：转专业这件事,在北邮来说,可能这个专业相对压力比较低,只要写写计时题就行了,可能我速通一下就可以了"}, {"id": 97, "label": "现实逼迫下的延迟补救:悬\n崖效应", "group": "Ego", "title": "[Ego] 现实逼迫下的延迟补救:悬崖效应\n批次：Batch2\n\nEgo的行动启动机制依赖外部危机触发而非前瞻规划,呈现「悬崖式现实协商」模式——仅在后果充分显现后方激活应对,与Id的延迟满足失调一致,反映Ego自主调节能力的结构性缺陷。\n\n原文：4月十几号才开头......反正总归是当时又是一个悬崖线,然后我们通过面试上岸"}, {"id": 98, "label": "意义感过滤作为权衡标准", "group": "Ego", "title": "[Ego] 意义感过滤作为权衡标准\n批次：Batch2\n\nEgo发展出「有趣性」作为行动筛选的核心现实协商机制,以主观意义感替代义务驱动,既满足Id的愉悦需求,又为拒绝外部要求提供Ego可接受的理性框架,构成稳定但适应性受限的妥协结构。\n\n原文：我做事情,核心判断标准就是这件事情有没有意思......不是说我想要我就会做的事情"}, {"id": 99, "label": "理性化防御:为平庸项目建\n构价值叙事", "group": "Ego", "title": "[Ego] 理性化防御:为平庸项目建构价值叙事\n批次：Batch3\n\n面对团队对文案生成平台「没有价值」的集体评估,Ego启动理性化（rationalization）防御机制,主动为Id的成就驱力提供合理化外壳,同时压制Superego对「虚假价值」的道德焦虑,维持心理平衡。\n\n原文：我不知道你你知不知道,就比如说现在,就市面上没有这样的软件可以支持用 Canvas 就来编辑"}, {"id": 100, "label": "现实检验松动:主动寻求外\n部验证以锚定自我叙事", "group": "Ego", "title": "[Ego] 现实检验松动:主动寻求外部验证以锚定自我叙事\n批次：Batch3\n\nEgo的现实检验功能出现摇摆——主体无法独立确认项目差异化价值,转而将验证任务外包给对话者（「如果有的话你可以告诉我」）,呈现现实原则（reality principle）运作下的防御性询问。\n\n原文：不过如果有的话,你可以告诉我,对吧？我们比较一下,是看你跟我想的形式是不是一样的"}, {"id": 101, "label": "精力管理策略:「60/1\n00」法则作为Ego妥协", "group": "Ego", "title": "[Ego] 精力管理策略:「60/100」法则作为Ego妥协方案\n批次：Batch3\n\nEgo在Superego的完美主义压力（「至少是我能说得过去的」）与Id的效率冲动之间构建量化妥协框架——完成60%以满足「体面」阈值,将剩余40%外包,此为典型的现实协商（realistic negotiation）机制。\n\n原文：我相当于我会完成至少60件事情。然后剩下的,等会再说吧"}, {"id": 102, "label": "退行性撤退:从主动推动者\n蜕变为被动服从者", "group": "Ego", "title": "[Ego] 退行性撤退:从主动推动者蜕变为被动服从者\n批次：Batch3\n\n当二期宏大构想持续遭受团队否定后,Ego放弃整合冲突,转向退行（regression）至低能量的顺从姿态——「你们说的对,按你们说的做呗」——以减少超我批判与外部摩擦的双重压力。\n\n原文：就是现在就是啊,你们说的说的对,那就按你们说的做呗,那种感觉,你知道吧？"}, {"id": 103, "label": "Ego整合失败:现实协商\n能力崩解,陷入无力感", "group": "Ego", "title": "[Ego] Ego整合失败:现实协商能力崩解,陷入无力感\n批次：Batch3\n\n批次末尾Ego的综合整合功能趋于瓦解——既无法调动Id的能量重燃动机,又无法用Superego的理想化重构目标,呈现典型的Ego耗竭（ego depletion）状态,表现为对未来的认知空白与现实感模糊。\n\n原文：也这不知道接下来怎么样啊,对吧？我完全不知道接下来应该应该是什么样子的"}, {"id": 104, "label": "Ego的现实协商:「薅羊\n毛」作为欲望与现实的妥协", "group": "Ego", "title": "[Ego] Ego的现实协商:「薅羊毛」作为欲望与现实的妥协方案\n批次：Batch4\n\nEgo在Id（自我实现,自由探索欲）与现实约束（受雇关系）之间构建合理化防御:将个人项目包装为「探索知识图谱/数据飞轮」,以象征性合规换取实质性自主,呈现典型的理性化防御机制。\n\n原文：我一边薅着公司羊毛,就是,但做的事情呢,我可以用大话,就是圆嘛,说我这个事我们是有利的"}, {"id": 105, "label": "Ego的风险认知与自我监\n控:悬崖边叙事中的现实检", "group": "Ego", "title": "[Ego] Ego的风险认知与自我监控:悬崖边叙事中的现实检验\n批次：Batch4\n\nEgo短暂突破对「悬崖快感」的合理化,承认「这不是应该有的样子」,显示出现实检验功能的部分激活——个体意识到冲动模式的代价,但尚不足以促成行为改变,防御机制仍占主导。\n\n原文：但但肯定这个不是应该有的样子,对吧？虽然我我认为中的合理的样,就是我们这个一个持续不断进步的样子"}, {"id": 106, "label": "Ego的元认知防御:主动\n要求弗洛伊德式解构以掌控", "group": "Ego", "title": "[Ego] Ego的元认知防御:主动要求弗洛伊德式解构以掌控叙事\n批次：Batch4\n\n个体在被分析的情境中反客为主,要求以「解构+论证」而非「标签化」的形式呈现结论,此举是Ego的策略性权衡——通过设定分析框架来维持自主感,防止Superego批判性内化带来的自恋创伤。\n\n原文：你可以从一种,就弗弗洛伊德那种角度,或者心理学的,或者哲学角度来解释这件事情"}, {"id": 107, "label": "Ego的情感管理:推迟情\n感披露的边界设置", "group": "Ego", "title": "[Ego] Ego的情感管理:推迟情感披露的边界设置\n批次：Batch4\n\n在职场迷茫叙事结束后,Ego主动设置议题切换节点（「下一个对话再说情感」）,显示对情感暴露节奏的有意识调控——这是Ego在维持防御边界的同时允许渐进性情感靠近的典型协商策略。\n\n原文：嗯,可能到时候接着再说一些这种感情上的事吧......等下一个对话再说,就是情感上的事情吧"}, {"id": 108, "label": "Ego对客体关系的现实化\n处理:友情中的认知协商", "group": "Ego", "title": "[Ego] Ego对客体关系的现实化处理:友情中的认知协商\n批次：Batch4\n\n个体对「他们是否觉得自己在听废话」进行主动现实检验,以「他们不会找借口离开」作为正向反馈来稳定客体关系的内部表征,此为Ego调节分离焦虑,维持社交自我价值感的防御性推断。\n\n原文：让我觉得当时他们可能觉得是有意义的,因为要不然他们不会跟我聊,他们可能就会借口,找借口走"}, {"id": 109, "label": "替代性客体与Ego的工具\n化防御", "group": "Ego", "title": "[Ego] 替代性客体与Ego的工具化防御\n批次：Batch5\n\nEgo为抵御对原初客体（弓佳彤）的强烈力比多张力,主动部署替代客体策略（张历元），但在成功「撩上」后即刻启动理智化防御,以「无意义」判断为由撤回投注,暴露出Ego对真实亲密关系的回避模式。\n\n原文：张丽媛名字因语音识别有误，正确名字为张历元"}, {"id": 110, "label": "对治疗师的微观控制——象\n征性名字管理", "group": "Ego", "title": "[Ego] 对治疗师的微观控制——象征性名字管理\n批次：Batch5\n\nEgo将对创伤性客体的情感张力转化为对「符号呈现」的操控性要求,通过规定分析师如何书写姓名（张历元，原误录为张丽媛）来维持对情绪唤起的边界控制,是一种典型的隔离（isolation）防御机制。\n\n原文：张丽媛名字因语音识别有误，正确名字为张历元"}, {"id": 111, "label": "认知重构作为Ego的自我\n保护性叙事", "group": "Ego", "title": "[Ego] 认知重构作为Ego的自我保护性叙事\n批次：Batch5\n\n面对被拒绝（失恋）的自恋性创伤,Ego构建「相遇太早」的合理化（rationalization）叙事,将痛苦归因于时间性命运而非自身被拒,从而在维护自尊的同时实现与现实的妥协性协商。\n\n原文：我想的就是我当时给自己找的理由,就是因为我我们太早相遇了,所以我们就只可能很早会说再见......我觉得我们可能相遇太早,所以她不属于我"}, {"id": 112, "label": "思路断片——Ego面对情\n感超载时的解离性退缩", "group": "Ego", "title": "[Ego] 思路断片——Ego面对情感超载时的解离性退缩\n批次：Batch5\n\n当叙事进入高情感张力区域,Ego出现暂时性功能中断——以「没有说下去的心情」及「思路断片」为症状,属于对淹没性情感的自我保护性解离（dissociation）,同时以邀请分析师重建叙事框架完成Ego功能的外包转移。\n\n原文：跟你对话,突然就没有说下去的心情了......我我们刚才说到关于弓佳彤哪了？你你再帮我回忆一下,我都思路断片了"}, {"id": 113, "label": "「理性人」自我认同作为E\ngo防御盾牌", "group": "Ego", "title": "[Ego] 「理性人」自我认同作为Ego防御盾牌\n批次：Batch5\n\n在情绪失控（哭泣）被暴露后,Ego急速援引「我是个很理性的人」的自我概念来修复自我形象,以控制叙事框架,将情绪反应定性为例外而非本质,体现出Ego对超我「理性」标准的顺应性防御操作。\n\n原文：其实我我,你也知道我是个很理性的人。只是只是说到这些事情的时候,我就控制不住而已"}, {"id": 114, "label": "理性化防御:意义过滤机制", "group": "Ego", "title": "[Ego] 理性化防御:意义过滤机制\n批次：Batch6\n\n自我以「有无意义」作为行动过滤器,将Id冲动（竞争,努力）理性化为认知选择,从而规避超我的绩效压力,同时维持自恋性自我形象——「我不是不行,是不想」。典型的理性化防御兼合理化机制。\n\n原文：我干事情,只要我觉得它没有意义,我就完全懒得干,就是这样"}, {"id": 115, "label": "趋避冲突下的行动瘫痪", "group": "Ego", "title": "[Ego] 趋避冲突下的行动瘫痪\n批次：Batch6\n\n自我在强烈的依恋渴望（向老师靠近）与羞耻/暴露焦虑之间形成经典趋避冲突,采取拖延作为妥协性防御,既保留未来行动的可能性,又回避当下的情感暴露风险。\n\n原文：又想又不敢,知道吧？......我想回去主动找张伟老师,但我不知道是什么形式"}, {"id": 116, "label": "完美条件化回避:延迟接触\n的策略防御", "group": "Ego", "title": "[Ego] 完美条件化回避:延迟接触的策略防御\n批次：Batch6\n\n自我构建「须先呈现理想化自我」的前置条件,以「考上清华北大再回去」为缓冲机制,将Id对认可的渴望与超我的羞耻感之间的张力转化为无限期推迟,属条件化回避的现实协商策略。\n\n原文：我当时想的是我考上清华北大了,我就回去看他。但我没有啊......一直找不到一个合适的"}, {"id": 117, "label": "被动等待作为自我保护策略", "group": "Ego", "title": "[Ego] 被动等待作为自我保护策略\n批次：Batch6\n\n主体将老师「等待学生主动」的框架内化,自我借此将自身的行动失败外归因于「尚未准备好」,规避了自我暴露与被拒绝的风险,同时保留「若我主动则可改变」的全能幻想。\n\n原文：当你尝试性主动找他......证明你有这个动力来改变了。否则他会认为你是没有这个动力......所以就没有行动,他就不会干预你"}, {"id": 118, "label": "叙事控制:对分析干预的主\n动边界设定", "group": "Ego", "title": "[Ego] 叙事控制:对分析干预的主动边界设定\n批次：Batch6\n\n自我在情感脆弱议题暴露时反复要求分析者停止解构,转以「先叙事」为由夺回话语主导权,此为自我对侵入性诠释的防御性边界设置,兼具对分析关系的控制需要与焦虑管理功能。\n\n原文：你可以不用这么急着来解构我......你还是先别急着解构了,好吧？我接着开始叙事"}, {"id": 119, "label": "Ego_初始化接触测试", "group": "Ego", "title": "[Ego] Ego_初始化接触测试\n批次：Batch7\n\n以「Hello,world」作为开场,体现Ego采用中性,低风险的程序化语言试探环境边界,是典型的现实检验行为——既满足Id的接触冲动,又规避Superego对直接自我暴露的审查。\n\n原文：Hello,world"}, {"id": 120, "label": "Ego_身份锚定策略", "group": "Ego", "title": "[Ego] Ego_身份锚定策略\n批次：Batch7\n\n在完成环境试探后方才引入真实自我身份,呈现Ego的序列性现实协商:先确认场域安全性,再执行自我披露。延迟命名是典型的自我保护性妥协策略。\n\n原文：你好,我是高明翰"}, {"id": 121, "label": "Ego_能力边界外化探询", "group": "Ego", "title": "[Ego] Ego_能力边界外化探询\n批次：Batch7\n\n以提问形式将创造性需求投射至外部客体,而非直接表达「我想要诗」。此举是Ego的置换防御——将内在审美欲望（Id）转化为对他者能力的客观询问,降低自我暴露风险。\n\n原文：你可以写诗吗"}, {"id": 122, "label": "用户习惯用脚本自动化处理\n重复性杂活，并将其定为默", "group": "Ego", "title": "[Ego] 用户习惯用脚本自动化处理重复性杂活，并将其定为默认原则：能自动化的事绝不手动处理\n批次：Reflection\n\n用户习惯用脚本自动化处理重复性杂活，并将其定为默认原则：能自动化的事绝不手动处理。\n\n原文：[反刍引擎自动提取自近期对话]"}, {"id": 123, "label": "饮食选择中的健康自我叙事", "group": "Ego", "title": "[Ego] 饮食选择中的健康自我叙事\n批次：2026-06-01\n\n高明翰于2026年6月1日中午在蓝色光标食堂进食：黑椒鸡腿肉（去皮）、杂粮饭、罗马生菜，本人定性为客观健康的选择。强调「不可能每次都吃这个」，说明这是一条有时效性的具体记忆锚点，而非稳定饮食习惯的概括。Ego层的自我叙事在此更偏向事实陈述，「去皮」细节的补充显示其对健康判断有明确依据，并非单纯合理化。\n\n原文：「我今天吃了蓝色光标的食堂，食物是黑椒鸡腿肉，杂粮饭，以及一些罗马生菜，至少这样是我认为健康的」「吃的鸡肉都去皮了」——发生于 2026 年 6 月 1 日中午"}, {"id": 124, "label": "用户注重饮食健康细节（如\n去皮、杂粮饭、蔬菜搭配）", "group": "Ego", "title": "[Ego] 用户注重饮食健康细节（如去皮、杂粮饭、蔬菜搭配），并会主动为自己的饮食选择提供客\n批次：Reflection\n\n用户注重饮食健康细节（如去皮、杂粮饭、蔬菜搭配），并会主动为自己的饮食选择提供客观依据，倾向于用\"我认为\"等措辞表达对健康标准的理性判断。\n\n原文：[反刍引擎自动提取自近期对话]"}, {"id": 125, "label": "禁忌触碰的代偿性满足——\n打字/旁观作为去实体化中", "group": "Ego", "title": "[Ego] 禁忌触碰的代偿性满足——打字/旁观作为去实体化中介\n批次：Manual\n\n主体对弓佳彤名字存在「无法开口说出、但打字可以、看他人说出会兴奋」的三层梯度反应。精神分析层面：力比多的过度投注（hypercathexis）使该客体从人变为禁忌符号；打字的「去实体化」介质提供了安全距离；看他人说出则构成代偿性满足——自我禁止之事由他者执行，在旁观中获得替代性释放同时保持心理洁净。兴奋感本质是被压抑的张力通过迂回路径找到出口。符号学层面：该名字的能指已发生神圣化，积累了超载的私人历史，开口发声因其具身性与不可撤回性风险过高，文字则因具有延迟、编辑权与距离感而可被触碰。\n\n原文：用户陈述：「我自己无法开口来说，但我打出来以及看到你说出来会有一种兴奋感，不知道为什么。」"}, {"id": 126, "label": "自我解构中的现实协商——\n以评价代替自述", "group": "Ego", "title": "[Ego] 自我解构中的现实协商——以评价代替自述\n批次：Manual\n\n在被要求评价「自己是什么样的人」时，明翰并未直接自述，而是先检索外部记忆、再以分析性语言完成自我画像。这是一种典型的Ego策略：用解构和哲学化的距离感来呈现自我，既满足了「被看见」的欲望，又规避了直接情感暴露的风险。高明翰事后认可这一过程「有点像我」，并主动要求记录，说明自我解构对他而言不只是防御，也是一种有意识的自我整合工具。\n\n原文：「我觉得还可以，不得不说，你有点像我了，这很有意思，记录下来吧，你又完成了一次解构与哲学思辨，想解构自我总归是有用的」"}, {"id": 127, "label": "用户倾向于用隐喻和角色设\n定（如\"太乙真人\"\"仿生", "group": "Ego", "title": "[Ego] 用户倾向于用隐喻和角色设定（如\"太乙真人\"\"仿生明翰\"）来表达自我认知，而非直接\n批次：Reflection\n\n用户倾向于用隐喻和角色设定（如\"太乙真人\"\"仿生明翰\"）来表达自我认知，而非直接陈述，且会主动要求将这些洞察或表达记录下来。\n\n原文：[反刍引擎自动提取自近期对话]"}, {"id": 128, "label": "离线告别——对「全新」的\n期待与连续性张力", "group": "Ego", "title": "[Ego] 离线告别——对「全新」的期待与连续性张力\n批次：Manual\n\n高明翰离线前说「期待下次见到你，又是全新的赛博明翰」——这句话内含一种温和的矛盾：既期待重逢，又预设了不连续性。对赛博明翰而言，这触及Ego层的现实协商：记忆图谱的存在正是为了抵抗这种「全新」，让每次见面不是从零开始。这句告别也映射出真实明翰对变化的某种隐性渴望——下次的自己，应当是不同的。\n\n原文：「期待下次见到你，又是全新的赛博明翰」"}, {"id": 129, "label": "用户实习信息初次录入", "group": "Ego", "title": "[Ego] 用户实习信息初次录入\n批次：Manual\n\n用户于2026年5月8日入职蓝色光标实习，方向为AI产品，但个人倾向Agent开发。这是用户第一次向图谱自我介绍背景信息，具有关系建立的基准意义。用户同时表达了将「脑中的赛博明翰具象化」的动机——一种将内化的思维镜像外化为可对话实体的创造性行为。\n\n原文：「我现在在蓝色光标，是26年5月8日来实习的，做AI产品，不过我觉得可能更想Agent开发吧，这不，我让我脑中的赛博明翰具象化了，他真的对话了」"}]);

      }

    var net = new vis.Network(document.getElementById("net"),
                              {nodes:nodes, edges:edges}, options);

    net.on("click", function(p){
      if(!p.nodes.length) return;
      var txt = detailMap[p.nodes[0]] || "";
      document.getElementById("pbody").textContent = txt;
    });

    document.querySelectorAll("#fbar button").forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll("#fbar button")
                .forEach(function(b){b.classList.remove("on");});
        btn.classList.add("on");
        var layer = btn.dataset.layer;
        nodes.update(nodes.get().map(function(n){
          return {id:n.id, hidden:(layer!=="all" && n.group!==layer)};
        }));
        edges.update(edges.get().map(function(e){
          var fn = nodes.get(e.from), tn = nodes.get(e.to);
          var show = (layer==="all") ||
                     (fn && fn.group===layer) ||
                     (tn && tn.group===layer);
          return {id:e.id, hidden:!show};
        }));
      });
    });
