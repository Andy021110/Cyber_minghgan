name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每日 18:00 跑评测回归（nightly，防记忆逻辑退化）
    - cron: '0 18 * * *'

jobs:
  test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint (new code & tests)
        # 只 gate 新代码与测试；存量 pipelines/ 仍有 tech debt，逐步清理后再纳入
        run: ruff check tests/ agent/ memory/ api/deps.py api/routes/v1.py
      - name: Pytest (zero API calls)
        run: pytest tests/ -q
      - name: Memory maintenance smoke (dry-run)
        run: |
          python pipelines/memory_maintenance.py forget
          python pipelines/memory_maintenance.py conflicts

  evals-nightly:
    name: Evals Regression (nightly)
    if: github.event_name == 'schedule'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: Fetch LongMemEval oracle dataset (not vendored in repo)
        # 数据集不入库（体积 + 许可），CI 每次现取；取不到就跳过跑分，不算失败
        continue-on-error: true
        run: |
          mkdir -p "evals/公认评测集/LongMemEval"
          curl -sSL --fail -o "evals/公认评测集/LongMemEval/longmemeval_oracle.json" \
            "https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_oracle.json"
      - name: Retrieval A/B (keyword vs hybrid)
        # 有数据集就跑 Recall@5 / MRR@5；没有就明确跳过，不静默假装通过
        run: |
          DATA="evals/公认评测集/LongMemEval/longmemeval_oracle.json"
          if [ -s "$DATA" ]; then
            python evals/retrieval_ab.py --data "$DATA" --k 5
          else
            echo "数据集不可用，跳过跑分。下载方式见 evals/数据集来源与下载说明.md"
          fi
